ss=\"eyebrow\">Perception Algorithm Engineer<\/div><h1 id=\"hero-title\">From observations<br>to <span>geometry.<\/span><\/h1><p class=\"intro\">I\u2019m Merci. I build perception software that turns imperfect sensor observations into useful geometry for robots.<\/p><div class=\"hero-actions\"><a class=\"text-link\" href=\"#work\">Explore selected work<\/a><a class=\"text-link\" href=\"https://github.com/hyandnn\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub profile<\/a><\/div><\/div><div class=\"hero-visual\"><div class=\"visual-top mono\"><span>GEOMETRY / TEMPORAL CONTEXT<\/span><span>SYNTHETIC<\/span><\/div><canvas data-scene=\"hero\" role=\"img\" aria-label=\"Isometric conceptual visualization of observed points and scene geometry\"><\/canvas><div class=\"visual-bottom\"><span>Observations \u2192 representation<\/span><span>Conceptual illustration<\/span><\/div><\/div><\/section>\n<div class=\"principles\"><div><b>Perception in consumer robotics<\/b><p>Stereo-led and LiDAR-led systems<\/p><\/div><div><b>Geometry with sensor context<\/b><p>Supporting IMU and odometry information<\/p><\/div><div><b>Engineering beyond the model<\/b><p>Integration, deployment and runtime efficiency<\/p><\/div><\/div>\n<section id=\"work\" aria-labelledby=\"work-title\"><div class=\"section-top\"><div><div class=\"eyebrow\">Selected work / 01\u201404<\/div><h2 id=\"work-title\">Four problems.<br>Concrete contributions.<\/h2><\/div><p>What I worked on, what changed, and the engineering decisions behind it.<\/p><\/div><div class=\"work-grid\"><a class=\"project-card \" href=\"projects/stereo.html\"><div class=\"card-view\"><canvas data-scene=\"stereo\" data-preview=\"true\" role=\"img\" aria-label=\"Synthetic top-view Stereo perception illustration\"><\/canvas><\/div><div class=\"card-copy\"><div class=\"card-heading\"><span class=\"index\">01<\/span><h3>Stereo perception<\/h3><\/div><p>A useful representation of thin obstacles, even when depth observations are sparse.<\/p><div BmSPH3lLn5TBiR2SIyOjyypLvjq8Kb/gNW/vcw8AAEKMoAIAAABAOsxRAQAAACAdggoAAAAA6RBUAAAAAEiHoAIAAABAOgQVAAAAANIhqAAAAACQDkEFAAAAgHQIKgAAAACkQ1ABAAAAIB2CCgAAAADpEFQAAAAASIegAgAAAEA6/x8LhXxI+akbmwAAAABJRU5ErkJggg==\" width=\"1080\" height=\"380\" loading=\"lazy\" alt=\"Synthetic Vision-based motion analysis conceptual illustration\"><\/div><div class=\"card-copy\"><div class=\"card-heading\"><span class=\"index\">04<\/span><h3>Vision-based motion analysis<\/h3><\/div><p>Aligning climbing-video frames to a wall template for movement analysis.<\/p><div class=\"card-foot\"><span class=\"mono\">GEOMETRIC ALIGNMENT<\/span><span>Read case study<\/span><\/div><\/div><\/a><\/div><p class=\"notice\">Visuals are independently created conceptual illustrations using synthetic data. They do not show product recordings, internal implementations or measured research results.<\/p><\/section>\n<section class=\"about\" id=\"about\" aria-labelledby=\"about-title\"><div><div class=\"eyebrow\">About / Merci<\/div><h2 id=\"about-title\">Geometry.<br>Context.<br>Implementation.<\/h2><\/div><div class=\"about-text\"><p>I work as a Perception Algorithm Engineer in consumer robotics. My focus spans geometric reasoning, model post-processing, temporal consistency and efficient C++ implementation.<\/p><p>I hold an M.Sc. in <b>Robotic Systems Engineering<\/b> from <b>RWTH Aachen University<\/b>. My earlier work includes physics-simulation integration and vision-based movement analysis.<\/p><div class=\"toolkit\"><div><b>Implementation<\/b><p>C++ \u00b7 Python \u00b7 CMake<br>Profiling & runtime optimization<\/p><\/div><div><b>Perception<\/b><p>OpenCV \u00b7 Point clouds<br>Geometry, semantics & tracking<\/p><\/div><div><b>Simulation<\/b><p>Collision detection<br>Spatial hierarchies & engine integration<\/p><\/div><\/div><p style=\"font-size:.9rem;margin-top:24px\">Additional research: a small neural-network surrogate for manufacturing simulation, paired with an interactive interface.<\/p><\/div><\/section>\n<section class=\"contact\" id=\"contact\" aria-labelledby=\"contact-title\"><div><div class=\"eyebrow\">Contact<\/div><h2 id=\"contact-title\">Let\u2019s talk engineering.<\/h2><p>Perception, geometry and systems that work in practice.<\/p><\/div><a class=\"text-link\" href=\"mailto:haoling.yang@rwth-aachen.de\">haoling.yang@rwth-aachen.de<\/a><\/section><\/main><footer><div class=\"wrap\"><span>Merci \u00b7 Geometry, perception & simulation<\/span><div class=\"footer-links\"><a href=\"https://github.com/hyandnn\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub<\/a><a href=\"mailto:haoling.yang@rwth-aachen.de\">Email<\/a><\/div><\/div><\/footer><script>document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(!h||/^(https?:|mailto:|data:)/.test(h))return;e.preventDefault();parent.postMessage({portfolioNavigation:h},'*');});<\/script><script>/* Independent conceptual scenes. No product data or production implementation. */\n(() => {\n  'use strict';\n  const TAU = Math.PI * 2;\n  const colors = { grid:'#1a2936', muted:'#879cac', point:'#7892a6', cyan:'#62e4d2', blue:'#85bbff', gold:'#f3bf77', text:'#dce7ef' };\n  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');\n  const scenes = [];\n  const boxHit = (dx,dy,dz,box,limit) => {\n    let lo=0, hi=limit;\n    const axes = [[dx,box[0],box[2]],[dy,box[1],box[3]]];\n    if(dz !== null) axes.push([dz,-.36,box[4]-.36]);\n    for(const [v,mn,mx] of axes){\n      if(Math.abs(v)<1e-8){if(!(mn<=0&&0<=mx))return null;}\n      else{let a=mn/v,b=mx/v;if(a>b)[a,b]=[b,a];lo=Math.max(lo,a);hi=Math.min(hi,b);}\n    }\n    return hi>=lo&&lo>0&&lo<limit?lo:null;\n  };\n  function stereoData(t){\n    const shift=.09*Math.sin(t*TAU);\n    const boxes=[[-1.2+shift,2.7,-.35+shift,3.4,.7],[.85,4.3,1.75,4.9,1.1],[.1,1.4,.95,1.48,.04]];\n    const points=[];\n    for(let row=0;row<95;row++)for(let col=0;col<110;col++){\n      const distance=.36/(.06+row*.0063+.004*Math.sin(col*2.13+row*1.71));\n      const dx=-.60+1.2*col/109+.003*Math.sin(col*1.17+row*2.31),dz=-.36/distance;\n      let nearest=distance, object=-1;\n      boxes.forEach((b,i)=>{const hit=boxHit(dx,1,dz,b,nearest);if(hit!==null){nearest=hit;object=i;}});\n      const x=dx*nearest,y=nearest,z=.36+dz*nearest;\n      const gap=Math.sin(x*5.1+y*.7)*Math.cos(y*3.4-x*.3);\n      if(y<.48||y>6||(gap>.38&&object<0)||(gap>.75&&object>=0))continue;\n      if(y>3.9&&(row+col)%3===0)continue;\n      if(object===2&&col%6!==0)continue;\n      points.push({x,y,z,object});\n    }\n    return {boxes,points};\n  }\n  function rayHit(angle,objects,limit=4){\n    const dx=Math.sin(angle),dy=Math.cos(angle);let nearest=limit,object=null;\n    for(const o of objects){\n      let hit=null;\n      if(o.type==='circle'){\n        const [x,y,r]=o.shape,b=dx*x+dy*y,disc=b*b-(x*x+y*y-r*r);\n        if(disc>=0&&b>0)hit=b-Math.sqrt(disc);\n      }else hit=boxHit(dx,dy,null,o.shape,nearest);\n      if(hit!==null&&hit>0&&hit<nearest){nearest=hit;object=o;}\n    }\n    return {distance:nearest,object,dx,dy};\n  }\n  function targetAt(t){return [1.65*Math.sin(t*TAU),1.65+.15*Math.cos(t*TAU)];}\n  function lidarData(t){\n    const target=targetAt(t);\n    const objects=[{type:'box',shape:[-.45,.8,.45,1.05],id:'occluder'},\n      {type:'box',shape:[-3.2,1,-3,2.2],id:'fence'},\n      {type:'box',shape:[1.5,-2.8,3,-2.55],id:'edge'},\n      {type:'box',shape:[-2.8,-1.5,-.9,-1.25],id:'overhang'},\n      {type:'circle',shape:[2.5,2.25,.5],id:'tree'},\n      {type:'circle',shape:[-.9,3,.42],id:'shrub'},\n      {type:'circle',shape:[2.8,-.5,.5],id:'shrub'},\n      {type:'circle',shape:[-2.55,-.05,.3],id:'shrub'},\n      {type:'circle',shape:[...target,.23],id:'target'}];\n    const rays=[];\n    for(let k=0;k<360;k++){\n      const ray=rayHit(k*TAU/360,objects);\n      // Tiny deterministic range perturbation, never free-space random scatter.\n      const d=ray.distance+(ray.object?.id==='target'?0:.008*Math.sin(k*2.3));\n      rays.push({...ray,x:ray.dx*d,y:ray.dy*d,k});\n    }\n    const visible=rays.some(r=>r.object?.id==='target');\n    return {objects,rays,target,visible};\n  }\n  function line(ctx,points,color,width=1,dash=[]){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.setLineDash([]);}\n  function dot(ctx,x,y,color,r=1.5){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}\n  function text(ctx,label,x,y,color=colors.muted,size=14){ctx.font=`${size}px \"Segoe UI\",Arial,sans-serif`;ctx.fillStyle=color;ctx.fillText(label,x,y);}\n  function outline(ctx,map,b,color,width=1){line(ctx,[map(b[0],b[1]),map(b[2],b[1]),map(b[2],b[3]),map(b[0],b[3]),map(b[0],b[1])],color,width);}\n  function robot(ctx,map,color){const [x,y]=map(0,0);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y-9);ctx.lineTo(x-6,y+4);ctx.lineTo(x+6,y+4);ctx.closePath();ctx.fill();}\n  function plotFrame(ctx,w,h,kind,panel,panels){\n    const left=panel*w/panels,right=(panel+1)*w/panels,pw=w/panels;\n    const preview=h<290;\n    let scale,cx,cy;\n    if(kind==='stereo'){scale=Math.min((pw-38)/7.4,(h-70)/6.6);cx=left+pw/2;cy=h-22;}\n    else{scale=Math.min((pw-40)/8.4,(h-70)/8.4);cx=left+pw/2;cy=(h+32)/2;}\n    const map=(x,y)=>[cx+x*scale,cy-y*scale];\n    ctx.save();ctx.beginPath();ctx.rect(left+1,45,pw-2,h-46);ctx.clip();\n    for(let x=-4;x<=4;x++){line(ctx,[map(x,kind==='stereo'?0:-4),map(x,kind==='stereo'?6:4)],colors.grid);}\n    for(let y=kind==='stereo'?0:-4;y<=(kind==='stereo'?6:4);y++)line(ctx,[map(-4,y),map(4,y)],colors.grid);\n    ctx.restore();\n    if(panel)line(ctx,[[left,20],[left,h-15]],'#263a49');\n    if(!preview){text(ctx,panels===1?'Top view':panel?'Representation':'Observations',left+22,29,colors.text,16);}\n    else text(ctx,kind==='stereo'?'FORWARD / STEREO':'SURROUND / LiDAR',left+20,27,colors.muted,13);\n    return {map,scale,left,pw,preview};\n  }\n  function drawStereo(scene){\n    const {ctx,w,h,t,layers,preview}=scene,panels=!preview&&w>=720?2:1;\n    const {boxes,points}=stereoData(t);\n    for(let panel=0;panel<panels;panel++){\n      const {map,scale,left,pw}=plotFrame(ctx,w,h,'stereo',panel,panels);\n      const frustum=[map(-.6*.48,.48),map(-3.6,6),map(3.6,6),map(.6*.48,.48)];\n      ctx.fillStyle='#13253255';ctx.beginPath();frustum.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();line(ctx,[...frustum,frustum[0]],'#365766');\n      const geometry=layers.geometry&&(panels===1||panel===1);\n      if(layers.points)for(const p of points){const [x,y]=map(p.x,p.y);dot(ctx,x,y,p.object<0?'#466677':geometry?p.object===2?colors.gold:colors.cyan:'#a7bdc7',p.object<0?(preview?.65:.85):(preview?1:1.3));}\n      if(geometry){\n        boxes.slice(0,2).forEach(b=>outline(ctx,map,b,colors.cyan,1.7));\n        const b=boxes[2];line(ctx,[map(b[0],b[1]),map(b[2],b[1])],colors.gold,3,[4,3]);\n        if(!preview){const [x,y]=map(b[2],b[1]);line(ctx,[[x+6,y],[x+18,y-16]],colors.gold);text(ctx,'Thin-obstacle hypothesis',Math.min(x+20,left+pw-190),y-21,colors.gold,14);}\n      }\n      robot(ctx,map,colors.cyan);\n      if(!preview){const [x,y]=map(-2.3,5.7);text(ctx,'Surface gaps & occlusion',x,y,colors.muted,13);}\n    }\n  }\n  function drawLidar(scene){\n    const {ctx,w,h,t,layers,preview}=scene,panels=!preview&&w>=720?2:1;\n    const data=lidarData(t);\n    for(let panel=0;panel<panels;panel++){\n      const {map,scale,left}=plotFrame(ctx,w,h,'lidar',panel,panels),[cx,cy]=map(0,0);\n      for(const r of [2,4]){ctx.beginPath();ctx.strokeStyle='#2b4359';ctx.arc(cx,cy,r*scale,0,TAU);ctx.stroke();}\n      if(layers.rays)for(const ray of data.rays){if(ray.k%10===0)line(ctx,[[cx,cy],map(ray.x,ray.y)],ray.object?'#243e56':'#172837');}\n      if(layers.points)for(const ray of data.rays){if(ray.object)dot(ctx,...map(ray.x,ray.y),ray.object.id==='target'?colors.blue:ray.object.id==='overhang'?colors.gold:'#90abc2',preview?1.2:1.6);}\n      // Ghost outlines describe scene geometry, not unobserved sensor returns.\n      for(const o of data.objects){if(o.type==='box')outline(ctx,map,o.shape,'#3e526188',1);}\n      const tracking=layers.tracks&&(panels===1||panel===1);\n      if(tracking){\n        const path=[];for(let k=45;k>=0;k--)path.push(map(...targetAt(t-k*.002)));\n        line(ctx,path,'#507797',2);\n        const [tx,ty]=map(...data.target);\n        ctx.strokeStyle=colors.blue;ctx.lineWidth=1.7;ctx.setLineDash(data.visible?[]:[4,4]);ctx.strokeRect(tx-14,ty-14,28,28);ctx.setLineDash([]);\n        if(!data.visible)line(ctx,path.slice(-12),colors.blue,2,[4,4]);\n        if(!preview)text(ctx,data.visible?'Track 07':'Track 07 \u00b7 occluded',tx-30,ty-23,colors.blue,14);\n      }\n      robot(ctx,map,colors.text);\n      if(!preview){const [x,y]=map(-2.8,-1.5);text(ctx,'Height structure',Math.max(left+10,x-18),y+24,colors.gold,13);}\n    }\n  }\n  function drawHero(scene){\n    const {ctx,w,h}=scene;\n    const scale=Math.min(w/9.1,h/6),cx=w*.34,cy=h*.85;\n    const iso=(x,y,z=0)=>[cx+(x*.87+y*.39)*scale,cy-(y*.53-x*.23+z)*scale];\n    for(let x=-3;x<=3;x++)line(ctx,[iso(x,0),iso(x,6)],'#223747');\n    for(let y=0;y<=6;y++)line(ctx,[iso(-3,y),iso(3,y)],'#223747');\n    const {boxes,points}=stereoData(.15);\n    for(const p of points){dot(ctx,...iso(p.x,p.y,p.z),p.object<0?'#385568':colors.cyan,p.object<0?.8:1.2);}\n    for(const b of boxes.slice(0,2)){\n      const bottom=[[b[0],b[1],0],[b[2],b[1],0],[b[2],b[3],0],[b[0],b[3],0]];\n      const top=bottom.map(p=>[p[0],p[1],b[4]]);\n      line(ctx,[...top,top[0]].map(p=>iso(...p)),colors.cyan,1.5);\n      line(ctx,[...bottom,bottom[0]].map(p=>iso(...p)),'#3e867f',1);\n      bottom.forEach((p,i)=>line(ctx,[iso(...p),iso(...top[i])],'#3e867f'));\n    }\n    const thin=boxes[2];line(ctx,[iso(thin[0],thin[1],.04),iso(thin[2],thin[1],.04)],colors.gold,2,[3,3]);\n    const origin=iso(0,0);dot(ctx,...origin,colors.text,4);line(ctx,[origin,iso(0,.5)],colors.text,2);\n    text(ctx,'SCENE GEOMETRY',22,30,colors.cyan,13);\n    text(ctx,'Supporting surface',22,h-22,colors.muted,13);\n  }\n  function render(scene){\n    const rect=scene.canvas.getBoundingClientRect();if(rect.width===0)return;\n    scene.w=rect.width;scene.h=rect.height;\n    const ratio=Math.min(window.devicePixelRatio||1,2);\n    const bw=Math.round(rect.width*ratio),bh=Math.round(rect.height*ratio);\n    if(scene.canvas.width!==bw||scene.canvas.height!==bh){scene.canvas.width=bw;scene.canvas.height=bh;}\n    scene.ctx.setTransform(ratio,0,0,ratio,0,0);scene.ctx.clearRect(0,0,scene.w,scene.h);\n    if(scene.kind==='hero')drawHero(scene);else if(scene.kind==='stereo')drawStereo(scene);else drawLidar(scene);\n    if(scene.range)scene.range.value=Math.round(scene.t*1000);\n    if(scene.output)scene.output.textContent=`${(scene.t*12).toFixed(1)} s`;\n  }\n  function setPlaying(scene,playing){\n    scene.playing=playing;\n    if(scene.button){scene.button.textContent=playing?'Pause':'Play';scene.button.setAttribute('aria-pressed',String(!playing));}\n  }\n  for(const canvas of document.querySelectorAll('canvas[data-scene]')){\n    const demo=canvas.closest('[data-demo]'),preview=canvas.dataset.preview==='true';\n    const scene={canvas,ctx:canvas.getContext('2d'),kind:canvas.dataset.scene,preview,t:preview?.18:.05,layers:{points:true,geometry:true,rays:true,tracks:true},playing:!!demo&&!reduced.matches,visible:true};\n    if(demo){\n      scene.button=demo.querySelector('[data-play]');scene.range=demo.querySelector('[data-time]');scene.output=demo.querySelector('[data-time-label]');\n      setPlaying(scene,scene.playing);\n      scene.button.addEventListener('click',()=>setPlaying(scene,!scene.playing));\n      scene.range.addEventListener('input',()=>{setPlaying(scene,false);scene.t=Number(scene.range.value)/1000;render(scene);});\n      for(const input of demo.querySelectorAll('[data-layer]'))input.addEventListener('change',()=>{scene.layers[input.dataset.layer]=input.checked;render(scene);});\n    }\n    scenes.push(scene);render(scene);\n  }\n  const resize=new ResizeObserver(entries=>{for(const entry of entries){const scene=scenes.find(s=>s.canvas===entry.target);if(scene)render(scene);}});\n  const observer=new IntersectionObserver(entries=>{for(const entry of entries){const scene=scenes.find(s=>s.canvas===entry.target);if(scene)scene.visible=entry.isIntersecting;}});\n  scenes.forEach(s=>{resize.observe(s.canvas);observer.observe(s.canvas);});\n  let previous=0;\n  function animate(now){\n    const dt=previous?Math.min((now-previous)/1000,.06):0;previous=now;\n    if(!document.hidden)for(const scene of scenes){if(scene.playing&&scene.visible){scene.t=(scene.t+dt/12)%1;render(scene);}}\n    requestAnimationFrame(animate);\n  }\n  if(scenes.some(s=>s.button))requestAnimationFrame(animate);\n  const mediaDemos=[];\n  for(const demo of document.querySelectorAll('[data-media-demo]')){\n    const button=demo.querySelector('button'),img=demo.querySelector('img');\n    button.addEventListener('click',()=>{const playing=button.getAttribute('aria-pressed')!=='true';img.src=playing?img.dataset.motion:img.dataset.static;button.setAttribute('aria-pressed',String(playing));button.textContent=playing?'Show still frame':'Play illustration';});\n    mediaDemos.push({button,img});\n  }\n  reduced.addEventListener('change',e=>{if(e.matches){scenes.forEach(s=>setPlaying(s,false));mediaDemos.forEach(({button,img})=>{img.src=img.dataset.static;button.setAttribute('aria-pressed','false');button.textContent='Play illustration';});}});\n})();\n<\/script><\/body><\/html>", "projects/collision.html": "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"dark\"><title>Physics simulation \u2014 Merci<\/title><meta name=\"description\" content=\"SAP, a BVH midphase and required more than reproducing its mathematics: it had to work with the engine's own object representations and the way geometry moved between query stages.<\/p><p>Broadphase, midphase and narrowphase solve different parts of that task. A useful extension had to fit those responsibilities without discarding existing behavior.<\/p><\/div><\/section><section class=\"story\"><div class=\"story-index mono\">02 / My contribution<\/div><div class=\"story-body\"><h2>Extend three stages, preserve existing options.<\/h2><div class=\"decision-grid\"><div class=\"decision\"><h3>Broadphase \u00b7 Sweep and Prune<\/h3><p>I introduced SAP as an additional way to identify potential collision candidates from spatial bounds.<\/p><\/div><div class=\"decision\"><h3>Midphase \u00b7 Bounding volume hierarchy<\/h3><p>I introduced a BVH midphase to organize geometry for subsequent collision queries.<\/p><\/div><div class=\"decision\"><h3>Narrowphase \u00b7 GJK<\/h3><p>I integrated GJK alongside existing algorithms, including SAT, to expand convex-geometry query options.<\/p><\/div><div class=\"decision\"><h3>Integration \u00b7 Engine adaptation<\/h3><p>I adapted the algorithms to the host engine's basic types, interfaces and data flow.<\/p><\/div><\/div><div class=\"result\"><div class=\"eyebrow\">Representative outcome<\/div><p>Expanded the engine's algorithm options across collision-query stages while retaining the original choices.<\/p><\/div><\/div><\/section><section class=\"story\"><div class=\"story-index mono\">03 / Engineering judgment<\/div><div class=\"story-body\"><h2>An established algorithm is still integration work.<\/h2><p>These were integrations of established algorithms, rather than new algorithm inventions. The engineering contribution was making them usable within another engine's constraints.<\/p><p>The added capabilities complemented the original implementation. Keeping the existing options available avoided presenting the work as a wholesale replacement of the collision system.<\/p><p>The illustration shows candidate filtering, hierarchical bounds and convex queries as distinct concepts. It does not encode the internal engine's object model or implementation.<\/p><\/div><\/section><section class=\"story\"><div class=\"story-index mono\">04 / Scope & limits<\/div><div class=\"story-body\"><h2>Capability, without invented benchmark claims.<\/h2><p>The publicly described result is broader functionality. There is no published benchmark here establishing a particular speedup or accuracy improvement.<\/p><p>The host engine remains unnamed. This page explains the integration contribution without publishing its source, internal class definitions or architecture.<\/p><\/div><\/section><div class=\"boundary\">All demonstrations use synthetic data. Project descriptions are limited to publicly shareable responsibilities and conceptual explanations.<\/div><div class=\"case-nav\"><div><small>Previous case<\/small><a href=\"lidar.html\">LiDAR perception<\/a><\/div><div><small>Next case<\/small><a href=\"motion.html\">Vision-based motion analysis<\/a><\/div><\/div><\/main><footer><div class=\"wrap\"><span>Merci \u00b7 Geometry, perception & simulation<\/span><div class=\"footer-links\"><a href=\"https://github.com/hyandnn\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub<\/a><a href=\"mailto:haoling.yang@rwth-aachen.de\">Email<\/a><\/div><\/div><\/footer><script>document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(!h||/^(https?:|mailto:|data:)/.test(h))return;e.preventDefault();parent.postMessage({portfolioNavigation:h},'*');});<\/script><script>/* Independent conceptual scenes. No product data or production implementation. */\n(() => {\n  'use strict';\n  const TAU = Math.PI * 2;\n  const colors = { grid:'#1a2936', muted:'#879cac', point:'#7892a6', cyan:'#62e4d2', blue:'#85bbff', gold:'#f3bf77', text:'#dce7ef' };\n  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');\n  const scenes = [];\n  const boxHit = (dx,dy,dz,box,limit) => {\n    let lo=0, hi=limit;\n    const axes = [[dx,box[0],box[2]],[dy,box[1],box[3]]];\n    if(dz !== null) axes.push([dz,-.36,box[4]-.36]);\n    for(const [v,mn,mx] of axes){\n      if(Math.abs(v)<1e-8){if(!(mn<=0&&0<=mx))return null;}\n      else{let a=mn/v,b=mx/v;if(a>b)[a,b]=[b,a];lo=Math.max(lo,a);hi=Math.min(hi,b);}\n    }\n    return hi>=lo&&lo>0&&lo<limit?lo:null;\n  };\n  function stereoData(t){\n    const shift=.09*Math.sin(t*TAU);\n    const boxes=[[-1.2+shift,2.7,-.35+shift,3.4,.7],[.85,4.3,1.75,4.9,1.1],[.1,1.4,.95,1.48,.04]];\n    const points=[];\n    for(let row=0;row<95;row++)for(let col=0;col<110;col++){\n      const distance=.36/(.06+row*.0063+.004*Math.sin(col*2.13+row*1.71));\n      const dx=-.60+1.2*col/109+.003*Math.sin(col*1.17+row*2.31),dz=-.36/distance;\n      let nearest=distance, object=-1;\n      boxes.forEach((b,i)=>{const hit=boxHit(dx,1,dz,b,nearest);if(hit!==null){nearest=hit;object=i;}});\n      const x=dx*nearest,y=nearest,z=.36+dz*nearest;\n      const gap=Math.sin(x*5.1+y*.7)*Math.cos(y*3.4-x*.3);\n      if(y<.48||y>6||(gap>.38&&object<0)||(gap>.75&&object>=0))continue;\n      if(y>3.9&&(row+col)%3===0)continue;\n      if(object===2&&col%6!==0)continue;\n      points.push({x,y,z,object});\n    }\n    return {boxes,points};\n  }\n  function rayHit(angle,objects,limit=4){\n    const dx=Math.sin(angle),dy=Math.cos(angle);let nearest=limit,object=null;\n    for(const o of objects){\n      let hit=null;\n      if(o.type==='circle'){\n        const [x,y,r]=o.shape,b=dx*x+dy*y,disc=b*b-(x*x+y*y-r*r);\n        if(disc>=0&&b>0)hit=b-Math.sqrt(disc);\n      }else hit=boxHit(dx,dy,null,o.shape,nearest);\n      if(hit!==null&&hit>0&&hit<nearest){nearest=hit;object=o;}\n    }\n    return {distance:nearest,object,dx,dy};\n  }\n  function targetAt(t){return [1.65*Math.sin(t*TAU),1.65+.15*Math.cos(t*TAU)];}\n  function lidarData(t){\n    const target=targetAt(t);\n    const objects=[{type:'box',shape:[-.45,.8,.45,1.05],id:'occluder'},\n      {type:'box',shape:[-3.2,1,-3,2.2],id:'fence'},\n      {type:'box',shape:[1.5,-2.8,3,-2.55],id:'edge'},\n      {type:'box',shape:[-2.8,-1.5,-.9,-1.25],id:'overhang'},\n      {type:'circle',shape:[2.5,2.25,.5],id:'tree'},\n      {type:'circle',shape:[-.9,3,.42],id:'shrub'},\n      {type:'circle',shape:[2.8,-.5,.5],id:'shrub'},\n      {type:'circle',shape:[-2.55,-.05,.3],id:'shrub'},\n      {type:'circle',shape:[...target,.23],id:'target'}];\n    const rays=[];\n    for(let k=0;k<360;k++){\n      const ray=rayHit(k*TAU/360,objects);\n      // Tiny deterministic range perturbation, never free-space random scatter.\n      const d=ray.distance+(ray.object?.id==='target'?0:.008*Math.sin(k*2.3));\n      rays.push({...ray,x:ray.dx*d,y:ray.dy*d,k});\n    }\n    const visible=rays.some(r=>r.object?.id==='target');\n    return {objects,rays,target,visible};\n  }\n  function line(ctx,points,color,width=1,dash=[]){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.setLineDash([]);}\n  function dot(ctx,x,y,color,r=1.5){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}\n  function text(ctx,label,x,y,color=colors.muted,size=14){ctx.font=`${size}px \"Segoe UI\",Arial,sans-serif`;ctx.fillStyle=color;ctx.fillText(label,x,y);}\n  function outline(ctx,map,b,color,width=1){line(ctx,[map(b[0],b[1]),map(b[2],b[1]),map(b[2],b[3]),map(b[0],b[3]),map(b[0],b[1])],color,width);}\n  function robot(ctx,map,color){const [x,y]=map(0,0);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y-9);ctx.lineTo(x-6,y+4);ctx.lineTo(x+6,y+4);ctx.closePath();ctx.fill();}\n  function plotFrame(ctx,w,h,kind,panel,panels){\n    const left=panel*w/panels,right=(panel+1)*w/panels,pw=w/panels;\n    const preview=h<290;\n    let scale,cx,cy;\n    if(kind==='stereo'){scale=Math.min((pw-38)/7.4,(h-70)/6.6);cx=left+pw/2;cy=h-22;}\n    else{scale=Math.min((pw-40)/8.4,(h-70)/8.4);cx=left+pw/2;cy=(h+32)/2;}\n    const map=(x,y)=>[cx+x*scale,cy-y*scale];\n    ctx.save();ctx.beginPath();ctx.rect(left+1,45,pw-2,h-46);ctx.clip();\n    for(let x=-4;x<=4;x++){line(ctx,[map(x,kind==='stereo'?0:-4),map(x,kind==='stereo'?6:4)],colors.grid);}\n    for(let y=kind==='stereo'?0:-4;y<=(kind==='stereo'?6:4);y++)line(ctx,[map(-4,y),map(4,y)],colors.grid);\n    ctx.restore();\n    if(panel)line(ctx,[[left,20],[left,h-15]],'#263a49');\n    if(!preview){text(ctx,panels===1?'Top view':panel?'Representation':'Observations',left+22,29,colors.text,16);}\n    else text(ctx,kind==='stereo'?'FORWARD / STEREO':'SURROUND / LiDAR',left+20,27,colors.muted,13);\n    return {map,scale,left,pw,preview};\n  }\n  function drawStereo(scene){\n    const {ctx,w,h,t,layers,preview}=scene,panels=!preview&&w>=720?2:1;\n    const {boxes,points}=stereoData(t);\n    for(let panel=0;panel<panels;panel++){\n      const {map,scale,left,pw}=plotFrame(ctx,w,h,'stereo',panel,panels);\n      const frustum=[map(-.6*.48,.48),map(-3.6,6),map(3.6,6),map(.6*.48,.48)];\n      ctx.fillStyle='#13253255';ctx.beginPath();frustum.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();line(ctx,[...frustum,frustum[0]],'#365766');\n      const geometry=layers.geometry&&(panels===1||panel===1);\n      if(layers.points)for(const p of points){const [x,y]=map(p.x,p.y);dot(ctx,x,y,p.object<0?'#466677':geometry?p.object===2?colors.gold:colors.cyan:'#a7bdc7',p.object<0?(preview?.65:.85):(preview?1:1.3));}\n      if(geometry){\n        boxes.slice(0,2).forEach(b=>outline(ctx,map,b,colors.cyan,1.7));\n        const b=boxes[2];line(ctx,[map(b[0],b[1]),map(b[2],b[1])],colors.gold,3,[4,3]);\n        if(!preview){const [x,y]=map(b[2],b[1]);line(ctx,[[x+6,y],[x+18,y-16]],colors.gold);text(ctx,'Thin-obstacle hypothesis',Math.min(x+20,left+pw-190),y-21,colors.gold,14);}\n      }\n      robot(ctx,map,colors.cyan);\n      if(!preview){const [x,y]=map(-2.3,5.7);text(ctx,'Surface gaps & occlusion',x,y,colors.muted,13);}\n    }\n  }\n  function drawLidar(scene){\n    const {ctx,w,h,t,layers,preview}=scene,panels=!preview&&w>=720?2:1;\n    const data=lidarData(t);\n    for(let panel=0;panel<panels;panel++){\n      const {map,scale,left}=plotFrame(ctx,w,h,'lidar',panel,panels),[cx,cy]=map(0,0);\n      for(const r of [2,4]){ctx.beginPath();ctx.strokeStyle='#2b4359';ctx.arc(cx,cy,r*scale,0,TAU);ctx.stroke();}\n      if(layers.rays)for(const ray of data.rays){if(ray.k%10===0)line(ctx,[[cx,cy],map(ray.x,ray.y)],ray.object?'#243e56':'#172837');}\n      if(layers.points)for(const ray of data.rays){if(ray.object)dot(ctx,...map(ray.x,ray.y),ray.object.id==='target'?colors.blue:ray.object.id==='overhang'?colors.gold:'#90abc2',preview?1.2:1.6);}\n      // Ghost outlines describe scene geometry, not unobserved sensor returns.\n      for(const o of data.objects){if(o.type==='box')outline(ctx,map,o.shape,'#3e526188',1);}\n      const tracking=layers.tracks&&(panels===1||panel===1);\n      if(tracking){\n        const path=[];for(let k=45;k>=0;k--)path.push(map(...targetAt(t-k*.002)));\n        line(ctx,path,'#507797',2);\n        const [tx,ty]=map(...data.target);\n        ctx.strokeStyle=colors.blue;ctx.lineWidth=1.7;ctx.setLineDash(data.visible?[]:[4,4]);ctx.strokeRect(tx-14,ty-14,28,28);ctx.setLineDash([]);\n        if(!data.visible)line(ctx,path.slice(-12),colors.blue,2,[4,4]);\n        if(!preview)text(ctx,data.visible?'Track 07':'Track 07 \u00b7 occluded',tx-30,ty-23,colors.blue,14);\n      }\n      robot(ctx,map,colors.text);\n      if(!preview){const [x,y]=map(-2.8,-1.5);text(ctx,'Height structure',Math.max(left+10,x-18),y+24,colors.gold,13);}\n    }\n  }\n  function drawHero(scene){\n    const {ctx,w,h}=scene;\n    const scale=Math.min(w/9.1,h/6),cx=w*.34,cy=h*.85;\n    const iso=(x,y,z=0)=>[cx+(x*.87+y*.39)*scale,cy-(y*.53-x*.23+z)*scale];\n    for(let x=-3;x<=3;x++)line(ctx,[iso(x,0),iso(x,6)],'#223747');\n    for(let y=0;y<=6;y++)line(ctx,[iso(-3,y),iso(3,y)],'#223747');\n    const {boxes,points}=stereoData(.15);\n    for(const p of points){dot(ctx,...iso(p.x,p.y,p.z),p.object<0?'#385568':colors.cyan,p.object<0?.8:1.2);}\n    for(const b of boxes.slice(0,2)){\n      const bottom=[[b[0],b[1],0],[b[2],b[1],0],[b[2],b[3],0],[b[0],b[3],0]];\n      const top=bottom.map(p=>[p[0],p[1],b[4]]);\n      line(ctx,[...top,top[0]].map(p=>iso(...p)),colors.cyan,1.5);\n      line(ctx,[...bottom,bottom[0]].map(p=>iso(...p)),'#3e867f',1);\n      bottom.forEach((p,i)=>line(ctx,[iso(...p),iso(...top[i])],'#3e867f'));\n    }\n    const thin=boxes[2];line(ctx,[iso(thin[0],thin[1],.04),iso(thin[2],thin[1],.04)],colors.gold,2,[3,3]);\n    const origin=iso(0,0);dot(ctx,...origin,colors.text,4);line(ctx,[origin,iso(0,.5)],colors.text,2);\n    text(ctx,'SCENE GEOMETRY',22,30,colors.cyan,13);\n    text(ctx,'Supporting surface',22,h-22,colors.muted,13);\n  }\n  function render(scene){\n    const rect=scene.canvas.getBoundingClientRect();if(rect.width===0)return;\n    scene.w=rect.width;scene.h=rect.height;\n    const ratio=Math.min(window.devicePixelRatio||1,2);\n    const bw=Math.round(rect.width*ratio),bh=Math.round(rect.height*ratio);\n    if(scene.canvas.width!==bw||scene.canvas.height!==bh){scene.canvas.width=bw;scene.canvas.height=bh;}\n    scene.ctx.setTransform(ratio,0,0,ratio,0,0);scene.ctx.clearRect(0,0,scene.w,scene.h);\n    if(scene.kind==='hero')drawHero(scene);else if(scene.kind==='stereo')drawStereo(scene);else drawLidar(scene);\n    if(scene.range)scene.range.value=Math.round(scene.t*1000);\n    if(scene.output)scene.output.textContent=`${(scene.t*12).toFixed(1)} s`;\n  }\n  function setPlaying(scene,playing){\n    scene.playing=playing;\n    if(scene.button){scene.button.textContent=playing?'Pause':'Play';scene.button.setAttribute('aria-pressed',String(!playing));}\n  }\n  for(const canvas of document.querySelectorAll('canvas[data-scene]')){\n    const demo=canvas.closest('[data-demo]'),preview=canvas.dataset.preview==='true';\n    const scene={canvas,ctx:canvas.getContext('2d'),kind:canvas.dataset.scene,preview,t:preview?.18:.05,layers:{points:true,geometry:true,rays:true,tracks:true},playing:!!demo&&!reduced.matches,visible:true};\n    if(demo){\n      scene.button=demo.querySelector('[data-play]');scene.range=demo.querySelector('[data-time]');scene.output=demo.querySelector('[data-time-label]');\n      setPlaying(scene,scene.playing);\n      scene.button.addEventListener('click',()=>setPlaying(scene,!scene.playing));\n      scene.range.addEventListener('input',()=>{setPlaying(scene,false);scene.t=Number(scene.range.value)/1000;render(scene);});\n      for(const input of demo.querySelectorAll('[data-layer]'))input.addEventListener('change',()=>{scene.layers[input.dataset.layer]=input.checked;render(scene);});\n    }\n    scenes.push(scene);render(scene);\n  }\n  const resize=new ResizeObserver(entries=>{for(const entry of entries){const scene=scenes.find(s=>s.canvas===entry.target);if(scene)render(scene);}});\n  const observer=new IntersectionObserver(entries=>{for(const entry of entries){const scene=scenes.find(s=>s.canvas===entry.target);if(scene)scene.visible=entry.isIntersecting;}});\n  scenes.forEach(s=>{resize.observe(s.canvas);observer.observe(s.canvas);});\n  let previous=0;\n  function animate(now){\n    const dt=previous?Math.min((now-previous)/1000,.06):0;previous=now;\n    if(!document.hidden)for(const scene of scenes){if(scene.playing&&scene.visible){scene.t=(scene.t+dt/12)%1;render(scene);}}\n    requestAnimationFrame(animate);\n  }\n  if(scenes.some(s=>s.button))requestAnimationFrame(animate);\n  const mediaDemos=[];\n  for(const demo of document.querySelectorAll('[data-media-demo]')){\n    const button=demo.querySelector('button'),img=demo.querySelector('img');\n    button.addEventListener('click',()=>{const playing=button.getAttribute('aria-pressed')!=='true';img.src=playing?img.dataset.motion:img.dataset.static;button.setAttribute('aria-pressed',String(playing));button.textContent=playing?'Show still frame':'Play illustration';});\n    mediaDemos.push({button,img});\n  }\n  reduced.addEventListener('change',e=>{if(e.matches){scenes.forEach(s=>setPlaying(s,false));mediaDemos.forEach(({button,img})=>{img.src=img.dataset.static;button.setAttribute('aria-pressed','false');button.textContent='Play illustration';});}});\n})();\n<\/script><\/body><\/html>", "projects/lidar.html": "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"dark\"><title>LiDAR perception \u2014 Merci<\/title><meta name=\"description\" content=\"Tracking dynamic targets in an established outdoor perception system.\"><link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iIzA5MGQxMiIvPjxwYXRoIGQ9Ik03IDI0VjlsOSA5IDktOXYxNSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNjJlNGQyIiBzdHJva2Utd2lkdGg9IjMiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4K\"><style>@charset \"UTF-8\";\n:root{color-scheme:dark;--bg:#090d12;--panel:#0e151e;--line:#24313e;--text:#edf3f6;--muted:#a2b1bf;--accent:#62e4d2;--blue:#85bbff;--gold:#f3bf77;--purple:#c4aaff;--max:1220px;font-family:Inter,\"Segoe UI\",Arial,sans-serif;font-size:16px}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:100px}body{margin:0;background:var(--bg);color:var(--text);line-height:1.65}a{color:inherit;text-decoration:none}button,input{font:inherit}button,a,input{touch-action:manipulation}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:5px}::selection{background:#62e4d244}p{margin:0 0 1.2rem}img{max-width:100%;height:auto;display:block}h1,h2,h3{line-height:1.12;letter-spacing:-.045em;margin:0;font-weight:600}h1{font-size:clamp(3rem,6.1vw,5.6rem)}h2{fo oolkit{grid-template-columns:1fr 1fr}.case-head h1{font-size:3.5rem}}\n@media(max-width:640px){main,.wrap{padding-inline:20px}header .wrap{height:70px;gap:16px}nav{gap:18px;font-size:.8rem}.brand{font-size:1.5rem}.hero{grid-template-columns:1fr;padding-block:46px 40px;gap:36px}.hero h1{font-size:clamp(2.7rem,10vw,3.6rem)}.hero .intro{font-size:1.05rem}.hero-actions{gap:26px}.hero-visual canvas{height:300px}.principles{gap:18px;grid-template-columns:1fr;padding-block:24px;margin-bottom:58px}.principles p{margin-top:3px}.section-top{display:block;margin-bottom:28px}.section-top p{margin-top:20px}.work-grid{grid-template-columns:1fr;gap:24px}.card-view{height:230px}.card-copy p{min-height:0}.card-copy{padding:24px}.about{grid-template-columns:1fr;gap:26px;margin-block:62px;padding-block:34px}.toolkit{grid-template-columns:1fr 1fr;gap:20px}.contact{margin-bottom:52px}.contact a{font-size:.95rem;overflow-wrap:anywhere}footer .wrap{flex-direction:column;gap:12px}.case-head{padding-block:34px}.case-head h1{font-size:2.7rem}.case-head .lead{font-size:1.05rem}.case-meta{grid-template-columns:1fr;gap:22px}.demo-head{padding:16px;align-items:start;flex-direction:column;gap:4px}.demo canvas{height:340px}.demo-controls{padding:16px;gap:16px}.timeline{flex-basis:60%}.layers{gap:14px}.demo-caption{padding:12px 16px 18px}.demo{margin-bottom:38px}.story{display:block;margin-bottom:42px}.story-index{margin-bottom:12px}.story-body h2{font-size:1.65rem}.decision-grid{grid-template-columns:1fr;gap:10px}.result{padding:18px 20px}.case-nav a{font-size:.9rem}.case-nav{gap:20px}.demo .wide-image{width:900px;max-width:none;height:auto}.media-scroll{overflow:auto}.media-row{padding:14px 16px;align-items:start;flex-direction:column}.notice{font-size:.8rem}}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.project-card{transition:none}.project-card:hover{transform:none}}\n<\/style><\/head><body><a class=\"skip\" href=\"#main\">Skip to content<\/a><header><div class=\"wrap\"><a class=\"brand\" href=\"../index.html\" aria-label=\"Merci homepage\">Merci<span>.<\/span><\/a><nav aria-label=\"Main navigation\"><a href=\"../index.html#work\">Work<\/a><a href=\"../index.html#about\">About<\/a><a href=\"../index.html#contact\">Contact<\/a><\/nav><\/div><\/header><main id=\"main\" class=\"blue\"><a class=\"back\" href=\"../index.html#work\">All selected work<\/a><section class=\"case-head\"><div class=\"eyebrow\">02 / LiDAR perception<\/div><h1>Keeping moving targets consistent across observations.<\/h1><p class=\"lead\">An outdoor scene changes between observations. I led the introduction of tracking into an existing perception framework, while implementing and maintaining the system through deployment issues.<\/p><div class=\"case-meta\"><div><span class=\"label mono\">MY ROLE<\/span><p>Tracking integration, implementation, maintenance and deployment fixes.<\/p><\/div><div><span class=\"label mono\">CONTEXT<\/span><p>LiDAR-led outdoor-robot perception, with supporting IMU and odometry information.<\/p><\/div><\/div><\/section><div class=\"demo\" data-demo=\"lidar\"><div class=\"demo-head\"><span>Explore the concept \u00b7 LiDAR perception<\/span><span>Independent synthetic demonstration<\/span><\/div><canvas data-scene=\"lidar\" role=\"img\" aria-label=\"Top view. Angular samples stop at the first surface. A moving target passes behind a static obstacle; the dotted track segment illustrates continuity during occlusion.\"><\/canvas><div class=\"demo-controls\"><button type=\"button\" data-play aria-pressed=\"false\">Pause<\/button><label class=\"timeline\"><span class=\"sr-label\" hidden>Time<\/span><input type=\"range\" min=\"0\" max=\"1000\" value=\"0\" data-time aria-label=\"Demonstration time\"><output data-time-label>0.0 s<\/output><\/label><div class=\"layers\" aria-label=\"Visualization layers\"><label><input type=\"checkbox\" data-layer=\"points\" checked>Returns<\/label><label><input type=\"checkbox\" data-layer=\"rays\" checked>Sampled rays<\/label><label><input type=\"checkbox\" data-layer=\"tracks\" checked>Track<\/label><\/div><\/div><p class=\"demo-caption\">Top view. Angular samples stop at the first surface. A moving target passes behind a static obstacle; the dotted track segment illustrates continuity during occlusion.<\/p><\/div><section class=\"story\"><div class=\"story-index mono\">01 / The problem<\/div><div class=\"story-body\"><h2>A static map meets a moving scene.<\/h2><p>People and pets move through outdoor environments. A static scene representation alone can struggle to describe how those observations evolve. Treating each observation in isolation also loses the continuity that makes a moving target easier to interpret.<\/p><p>Outdoor geometry posed another challenge: a representation influenced by indoor, two-dimensional grids needed to preserve relevant height information, including overhanging obstacles.<\/p><\/div><\/section><section class=\"story\"><div class=\"story-index mono\">02 / My contribution<\/div><div class=\"story-body\"><h2>Add continuity to an existing framework.<\/h2><p>The main system architecture had already been selected before I joined. My responsibility was to implement and maintain the perception system, resolve deployment problems, and extend it where the established representation was insufficient.<\/p><p>I led the introduction of an object-tracking module to address dynamic targets. This added a temporal representation to a system that also had to reason about static scene structure.<\/p><div class=\"result\"><div class=\"eyebrow\">Representative outcome<\/div><p>Introduced tracking into the established system to handle the limits of static representations around moving targets.<\/p><\/div><\/div><\/section><section class=\"story\"><div class=\"story-index mono\">03 / Engineering judgment<\/div><div class=\"story-body\"><h2>Time and height both carry information.<\/h2><div class=\"decision-grid\"><div class=\"decision\"><h3>Observations versus target state<\/h3><p>A return describes what is observed now. A track represents continuity across observations. The illustration separates those two ideas so they can be inspected independently.<\/p><\/div><div class=\"decision\"><h3>Height beyond a flat grid<\/h3><p>I worked on deployment issues involving height structure and overhanging obstacles, where a purely two-dimensional interpretation was insufficient.<\/p><\/div><div class=\"decision\"><h3>Motion in context<\/h3><p>Supporting robot-motion information helps distinguish changes in observations from changes caused by the observing platform.<\/p><\/div><div class=\"decision\"><h3>Extend an operating system<\/h3><p>The work was integration within an established framework: respecting existing interfaces and maintaining deployed behavior while adding capability.<\/p><\/div><\/div><\/div><\/section><section class=\"story\"><div class=\"story-index mono\">04 / Scope & limits<\/div><div class=\"story-body\"><h2>Ownership, stated precisely.<\/h2><p>I led the tracking addition, rather than designing the original perception architecture. The account here focuses on implementation, integration and the deployment problems I helped resolve.<\/p><p>The synthetic track demonstrates temporal continuity and a short occlusion. Its dotted segment is an illustrative continuation, not a claim about a product's prediction policy or performance. No internal recordings, parameters or deployment metrics are shown.<\/p><\/div><\/section><div class=\"boundary\">All demonstrations use synthetic data. Project descriptions are limited to publicly shareable responsibilities and conceptual explanations.<\/div><div class=\"case-nav\"><div><small>Previous case<\/small><a href=\"stereo.html\">Stereo perception<\/a><\/div><div><small>Next case<\/small><a href=\"collision.html\">Physics simulation<\/a><\/div><\/div><\/main><footer><div class=\"wrap\"><span>Merci \u00b7 Geometry, perception & simulation<\/span><div class=\"footer-links\"><a href=\"https://github.com/hyandnn\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub<\/a><a href=\"mailto:haoling.yang@rwth-aachen.de\">Email<\/a><\/div><\/div><\/footer><script>document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(!h||/^(https?:|mailto:|data:)/.test(h))return;e.preventDefault();parent.postMessage({portfolioNavigation:h},'*');});<\/script><script>/* Independent conceptual scenes. No product data or production implementation. */\n(() => {\n  'use strict';\n  const TAU = Math.PI * 2;\n  const colors = { grid:'#1a2936', muted:'#879cac', point:'#7892a6', cyan:'#62e4d2', blue:'#85bbff', gold:'#f3bf77', text:'#dce7ef' };\n  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');\n  const scenes = [];\n  const boxHit = (dx,dy,dz,box,limit) => {\n    let lo=0, hi=limit;\n    const axes = [[dx,box[0],box[2]],[dy,box[1],box[3]]];\n    if(dz !== null) axes.push([dz,-.36,box[4]-.36]);\n    for(const [v,mn,mx] of axes){\n      if(Math.abs(v)<1e-8){if(!(mn<=0&&0<=mx))return null;}\n      else{let a=mn/v,b=mx/v;if(a>b)[a,b]=[b,a];lo=Math.max(lo,a);hi=Math.min(hi,b);}\n    }\n    return hi>=lo&&lo>0&&lo<limit?lo:null;\n  };\n  function stereoData(t){\n    const shift=.09*Math.sin(t*TAU);\n    const boxes=[[-1.2+shift,2.7,-.35+shift,3.4,.7],[.85,4.3,1.75,4.9,1.1],[.1,1.4,.95,1.48,.04]];\n    const points=[];\n    for(let row=0;row<95;row++)for(let col=0;col<110;col++){\n      const distance=.36/(.06+row*.0063+.004*Math.sin(col*2.13+row*1.71));\n      const dx=-.60+1.2*col/109+.003*Math.sin(col*1.17+row*2.31),dz=-.36/distance;\n      let nearest=distance, object=-1;\n      boxes.forEach((b,i)=>{const hit=boxHit(dx,1,dz,b,nearest);if(hit!==null){nearest=hit;object=i;}});\n      const x=dx*nearest,y=nearest,z=.36+dz*nearest;\n      const gap=Math.sin(x*5.1+y*.7)*Math.cos(y*3.4-x*.3);\n      if(y<.48||y>6||(gap>.38&&object<0)||(gap>.75&&object>=0))continue;\n      if(y>3.9&&(row+col)%3===0)continue;\n      if(object===2&&col%6!==0)continue;\n      points.push({x,y,z,object});\n    }\n    return {boxes,points};\n  }\n  function rayHit(angle,objects,limit=4){\n    const dx=Math.sin(angle),dy=Math.cos(angle);let nearest=limit,object=null;\n    for(const o of objects){\n      let hit=null;\n      if(o.type==='circle'){\n        const [x,y,r]=o.shape,b=dx*x+dy*y,disc=b*b-(x*x+y*y-r*r);\n        if(disc>=0&&b>0)hit=b-Math.sqrt(disc);\n      }else hit=boxHit(dx,dy,null,o.shape,nearest);\n      if(hit!==null&&hit>0&&hit<nearest){nearest=hit;object=o;}\n    }\n    return {distance:nearest,object,dx,dy};\n  }\n  function targetAt(t){return [1.65*Math.sin(t*TAU),1.65+.15*Math.cos(t*TAU)];}\n  function lidarData(t){\n    const target=targetAt(t);\n    const objects=[{type:'box',shape:[-.45,.8,.45,1.05],id:'occluder'},\n      {type:'box',shape:[-3.2,1,-3,2.2],id:'fence'},\n      {type:'box',shape:[1.5,-2.8,3,-2.55],id:'edge'},\n      {type:'box',shape:[-2.8,-1.5,-.9,-1.25],id:'overhang'},\n      {type:'circle',shape:[2.5,2.25,.5],id:'tree'},\n      {type:'circle',shape:[-.9,3,.42],id:'shrub'},\n      {type:'circle',shape:[2.8,-.5,.5],id:'shrub'},\n      {type:'circle',shape:[-2.55,-.05,.3],id:'shrub'},\n      {type:'circle',shape:[...target,.23],id:'target'}];\n    const rays=[];\n    for(let k=0;k<360;k++){\n      const ray=rayHit(k*TAU/360,objects);\n      // Tiny deterministic range perturbation, never free-space random scatter.\n      const d=ray.distance+(ray.object?.id==='target'?0:.008*Math.sin(k*2.3));\n      rays.push({...ray,x:ray.dx*d,y:ray.dy*d,k});\n    }\n    const visible=rays.some(r=>r.object?.id==='target');\n    return {objects,rays,target,visible};\n  }\n  function line(ctx,points,color,width=1,dash=[]){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.setLineDash([]);}\n  function dot(ctx,x,y,color,r=1.5){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}\n  function text(ctx,label,x,y,color=colors.muted,size=14){ctx.font=`${size}px \"Segoe UI\",Arial,sans-serif`;ctx.fillStyle=color;ctx.fillText(label,x,y);}\n  function outline(ctx,map,b,color,width=1){line(ctx,[map(b[0],b[1]),map(b[2],b[1]),map(b[2],b[3]),map(b[0],b[3]),map(b[0],b[1])],color,width);}\n  function robot(ctx,map,color){const [x,y]=map(0,0);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y-9);ctx.lineTo(x-6,y+4);ctx.lineTo(x+6,y+4);ctx.closePath();ctx.fill();}\n  function plotFrame(ctx,w,h,kind,panel,panels){\n    const left=panel*w/panels,right=(panel+1)*w/panels,pw=w/panels;\n    const preview=h<290;\n    let scale,cx,cy;\n    if(kind==='stereo'){scale=Math.min((pw-38)/7.4,(h-70)/6.6);cx=left+pw/2;cy=h-22;}\n    else{scale=Math.min((pw-40)/8.4,(h-70)/8.4);cx=left+pw/2;cy=(h+32)/2;}\n    const map=(x,y)=>[cx+x*scale,cy-y*scale];\n    ctx.save();ctx.beginPath();ctx.rect(left+1,45,pw-2,h-46);ctx.clip();\n    for(let x=-4;x<=4;x++){line(ctx,[map(x,kind==='stereo'?0:-4),map(x,kind==='stereo'?6:4)],colors.grid);}\n    for(let y=kind==='stereo'?0:-4;y<=(kind==='stereo'?6:4);y++)line(ctx,[map(-4,y),map(4,y)],colors.grid);\n    ctx.restore();\n    if(panel)line(ctx,[[left,20],[left,h-15]],'#263a49');\n    if(!preview){text(ctx,panels===1?'Top view':panel?'Representation':'Observations',left+22,29,colors.text,16);}\n    else text(ctx,kind==='stereo'?'FORWARD / STEREO':'SURROUND / LiDAR',left+20,27,colors.muted,13);\n    return {map,scale,left,pw,preview};\n  }\n  function drawStereo(scene){\n    const {ctx,w,h,t,layers,preview}=scene,panels=!preview&&w>=720?2:1;\n    const {boxes,points}=stereoData(t);\n    for(let panel=0;panel<panels;panel++){\n      const {map,scale,left,pw}=plotFrame(ctx,w,h,'stereo',panel,panels);\n      const frustum=[map(-.6*.48,.48),map(-3.6,6),map(3.6,6),map(.6*.48,.48)];\n      ctx.fillStyle='#13253255';ctx.beginPath();frustum.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();line(ctx,[...frustum,frustum[0]],'#365766');\n      const geometry=layers.geometry&&(panels===1||panel===1);\n      if(layers.points)for(const p of points){const [x,y]=map(p.x,p.y);dot(ctx,x,y,p.object<0?'#466677':geometry?p.object===2?colors.gold:colors.cyan:'#a7bdc7',p.object<0?(preview?.65:.85):(preview?1:1.3));}\n      if(geometry){\n        boxes.slice(0,2).forEach(b=>outline(ctx,map,b,colors.cyan,1.7));\n        const b=boxes[2];line(ctx,[map(b[0],b[1]),map(b[2],b[1])],colors.gold,3,[4,3]);\n        if(!preview){const [x,y]=map(b[2],b[1]);line(ctx,[[x+6,y],[x+18,y-16]],colors.gold);text(ctx,'Thin-obstacle hypothesis',Math.min(x+20,left+pw-190),y-21,colors.gold,14);}\n      }\n      robot(ctx,map,colors.cyan);\n      if(!preview){const [x,y]=map(-2.3,5.7);text(ctx,'Surface gaps & occlusion',x,y,colors.muted,13);}\n    }\n  }\n  function drawLidar(scene){\n    const {ctx,w,h,t,layers,preview}=scene,panels=!preview&&w>=720?2:1;\n    const data=lidarData(t);\n    for(let panel=0;panel<panels;panel++){\n      const {map,scale,left}=plotFrame(ctx,w,h,'lidar',panel,panels),[cx,cy]=map(0,0);\n      for(const r of [2,4]){ctx.beginPath();ctx.strokeStyle='#2b4359';ctx.arc(cx,cy,r*scale,0,TAU);ctx.stroke();}\n      if(layers.rays)for(const ray of data.rays){if(ray.k%10===0)line(ctx,[[cx,cy],map(ray.x,ray.y)],ray.object?'#243e56':'#172837');}\n      if(layers.points)for(const ray of data.rays){if(ray.object)dot(ctx,...map(ray.x,ray.y),ray.object.id==='target'?colors.blue:ray.object.id==='overhang'?colors.gold:'#90abc2',preview?1.2:1.6);}\n      // Ghost outlines describe scene geometry, not unobserved sensor returns.\n      for(const o of data.objects){if(o.type==='box')outline(ctx,map,o.shape,'#3e526188',1);}\n      const tracking=layers.tracks&&(panels===1||panel===1);\n      if(tracking){\n        const path=[];for(let k=45;k>=0;k--)path.push(map(...targetAt(t-k*.002)));\n        line(ctx,path,'#507797',2);\n        const [tx,ty]=map(...data.target);\n        ctx.strokeStyle=colors.blue;ctx.lineWidth=1.7;ctx.setLineDash(data.visible?[]:[4,4]);ctx.strokeRect(tx-14,ty-14,28,28);ctx.setLineDash([]);\n        if(!data.visible)line(ctx,path.slice(-12),colors.blue,2,[4,4]);\n        if(!preview)text(ctx,data.visible?'Track 07':'Track 07 \u00b7 occluded',tx-30,ty-23,colors.blue,14);\n      }\n      robot(ctx,map,colors.text);\n      if(!preview){const [x,y]=map(-2.8,-1.5);text(ctx,'Height structure',Math.max(left+10,x-18),y+24,colors.gold,13);}\n    }\n  }\n  function drawHero(scene){\n    const {ctx,w,h}=scene;\n    const scale=Math.min(w/9.1,h/6),cx=w*.34,cy=h*.85;\n    const iso=(x,y,z=0)=>[cx+(x*.87+y*.39)*scale,cy-(y*.53-x*.23+z)*scale];\n    for(let x=-3;x<=3;x++)line(ctx,[iso(x,0),iso(x,6)],'#223747');\n    for(let y=0;y<=6;y++)line(ctx,[iso(-3,y),iso(3,y)],'#223747');\n    const {boxes,points}=stereoData(.15);\n    for(const p of points){dot(ctx,...iso(p.x,p.y,p.z),p.object<0?'#385568':colors.cyan,p.object<0?.8:1.2);}\n    for(const b of boxes.slice(0,2)){\n      const bottom=[[b[0],b[1],0],[b[2],b[1],0],[b[2],b[3],0],[b[0],b[3],0]];\n      const top=bottom.map(p=>[p[0],p[1],b[4]]);\n      line(ctx,[...top,top[0]].map(p=>iso(...p)),colors.cyan,1.5);\n      line(ctx,[...bottom,bottom[0]].map(p=>iso(...p)),'#3e867f',1);\n      bottom.forEach((p,i)=>line(ctx,[iso(...p),iso(...top[i])],'#3e867f'));\n    }\n    const thin=boxes[2];line(ctx,[iso(thin[0],thin[1],.04),iso(thin[2],thin[1],.04)],colors.gold,2,[3,3]);\n    const origin=iso(0,0);dot(ctx,...origin,colors.text,4);line(ctx,[origin,iso(0,.5)],colors.text,2);\n    text(ctx,'SCENE GEOMETRY',22,30,colors.cyan,13);\n    text(ctx,'Supporting surface',22,h-22,colors.muted,13);\n  }\n  function render(scene){\n    const rect=scene.canvas.getBoundingClientRect();if(rect.width===0)return;\n    scene.w=rect.width;scene.h=rect.height;\n    const ratio=Math.min(window.devicePixelRatio||1,2);\n    const bw=Math.round(rect.width*ratio),bh=Math.round(rect.height*ratio);\n    if(scene.canvas.width!==bw||scene.canvas.height!==bh){scene.canvas.width=bw;scene.canvas.height=bh;}\n    scene.ctx.setTransform(ratio,0,0,ratio,0,0);scene.ctx.clearRect(0,0,scene.w,scene.h);\n    if(scene.kind==='hero')drawHero(scene);else if(scene.kind==='stereo')drawStereo(scene);else drawLidar(scene);\n    if(scene.range)scene.range.value=Math.round(scene.t*1000);\n    if(scene.output)scene.output.textContent=`${(scene.t*12).toFixed(1)} s`;\n  }\n  function setPlaying(scene,playing){\n    scene.playing=playing;\n    if(scene.button){scene.button.textContent=playing?'Pause':'Play';scene.button.setAttribute('aria-pressed',String(!playing));}\n  }\n  for(const canvas of document.querySelectorAll('canvas[data-scene]')){\n    const demo=canvas.closest('[data-demo]'),preview=canvas.dataset.preview==='true';\n    const scene={canvas,ctx:canvas.getContext('2d'),kind:canvas.dataset.scene,preview,t:preview?.18:.05,layers:{points:true,geometry:true,rays:true,tracks:true},playing:!!demo&&!reduced.matches,visible:true};\n    if(demo){\n      scene.button=demo.querySelector('[data-play]');scene.range=demo.querySelector('[data-time]');scene.output=demo.querySelector('[data-time-label]');\n      setPlaying(scene,scene.playing);\n      scene.button.addEventListener('click',()=>setPlaying(scene,!scene.playing));\n      scene.range.addEventListener('input',()=>{setPlaying(scene,false);scene.t=Number(scene.range.value)/1000;render(scene);});\n      for(const input of demo.querySelectorAll('[data-layer]'))input.addEventListener('change',()=>{scene.layers[input.dataset.layer]=input.checked;render(scene);});\n    }\n    scenes.push(scene);render(scene);\n  }\n  const resize=new ResizeObserver(entries=>{for(const entry of entries){const scene=scenes.find(s=>s.canvas===entry.target);if(scene)render(scene);}});\n  const observer=new IntersectionObserver(entries=>{for(const entry of entries){const scene=scenes.find(s=>s.canvas===entry.target);if(scene)scene.visible=entry.isIntersecting;}});\n  scenes.forEach(s=>{resize.observe(s.canvas);observer.observe(s.canvas);});\n  let previous=0;\n  function animate(now){\n    const dt=previous?Math.min((now-previous)/1000,.06):0;previous=now;\n    if(!document.hidden)for(const scene of scenes){if(scene.playing&&scene.visible){scene.t=(scene.t+dt/12)%1;render(scene);}}\n    requestAnimationFrame(animate);\n  }\n  if(scenes.some(s=>s.button))requestAnimationFrame(animate);\n  const mediaDemos=[];\n  for(const demo of document.querySelectorAll('[data-media-demo]')){\n    const button=demo.querySelector('button'),img=demo.querySelector('img');\n    button.addEventListener('click',()=>{const playing=button.getAttribute('aria-pressed')!=='true';img.src=playing?img.dataset.motion:img.dataset.static;button.setAttribute('aria-pressed',String(playing));button.textContent=playing?'Show still frame':'Play illustration';});\n    mediaDemos.push({button,img});\n  }\n  reduced.addEventListener('change',e=>{if(e.matches){scenes.forEach(s=>setPlaying(s,false));mediaDemos.forEach(({button,img})=>{img.src=img.dataset.static;button.setAttribute('aria-pressed','false');button.textContent='Play illustration';});}});\n})();\n<\/script><\/body><\/html>", "projects/motion.html": "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"dark\"><title>Vision-based motion analysis \u2014 Merci<\/title><meta name=\"description\" content=\"Aligning climbing-video frames to a wall template for movement analysis.\"><link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iIzA5MGQxMiIvPjxwYXRoIGQ9Ik03IDI0VjlsOSA5IDktOXYxNSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNjJlNGQyIiBzdHJva2Utd2lkdGg9IjMiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4K\"><style>@charset \"UTF-8\";\n:root{color-scheme:dark;--bg:#090d12;--pan  and joint-angle analysis.<\/p><div class=\"result\"><div class=\"eyebrow\">Representative outcome<\/div><p>Established a common wall reference for interpreting observations across moving-camera video frames.<\/p><\/div><\/div><\/section><section class=\"story\"><div class=\"story-index mono\">03 / Engineering judgment<\/div><div class=\"story-body\"><h2>Alignment is a prerequisite for interpretation.<\/h2><p>The middle panel explicitly distinguishes the observed frame from the reference template. Corresponding points communicate the alignment task before the trajectory is interpreted.<\/p><p>Hold detection and pose estimation provide observations; geometric alignment makes observations from different frames comparable. The movement trace illustrates that distinction.<\/p><p>This page uses an independently generated animation because the original research videos are unavailable. The displayed trace is explanatory, not a recovered experiment.<\/p><\/div><\/section><section class=\"story\"><div class=\"story-index mono\">04 / Scope & limits<\/div><div class=\"story-body\"><h2>A monocular reference has limits.<\/h2><p>Monocular depth ambiguity remains a limitation. A wall-aligned image reference is not a complete three-dimensional reconstruction of the climber's movement.<\/p><p>The synthetic animation does not establish measurement accuracy or research performance. No unavailable recordings or reconstructed experimental metrics are presented as evidence.<\/p><\/div><\/section><div class=\"boundary\">All demonstrations use synthetic data. Project descriptions are limited to publicly shareable responsibilities and conceptual explanations.<\/div><div class=\"case-nav\"><div><small>Previous case<\/small><a href=\"collision.html\">Physics simulation<\/a><\/div><div><small>Next case<\/small><a href=\"stereo.html\">Stereo perception<\/a><\/div><\/div><\/main><footer><div class=\"wrap\"><span>Merci \u00b7 Geometry, perception & simulation<\/span><div class=\"footer-links\"><a href=\"https://github.com/hyandnn\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub<\/a><a href=\"mailto:haoling.yang@rwth-aachen.de\">Email<\/a><\/div><\/div><\/footer><script>document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(!h||/^(https?:|mailto:|data:)/.test(h))return;e.preventDefault();parent.postMessage({portfolioNavigation:h},'*');});<\/script><script>/* Independent conceptual scenes. No product data or production implementation. */\n(() => {\n  'use strict';\n  const TAU = Math.PI * 2;\n  const colors = { grid:'#1a2936', muted:'#879cac', point:'#7892a6', cyan:'#62e4d2', blue:'#85bbff', gold:'#f3bf77', text:'#dce7ef' };\n  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');\n  const scenes = [];\n  const boxHit = (dx,dy,dz,box,limit) => {\n    let lo=0, hi=limit;\n    const axes = [[dx,box[0],box[2]],[dy,box[1],box[3]]];\n    if(dz !== null) axes.push([dz,-.36,box[4]-.36]);\n    for(const [v,mn,mx] of axes){\n      if(Math.abs(v)<1e-8){if(!(mn<=0&&0<=mx))return null;}\n      else{let a=mn/v,b=mx/v;if(a>b)[a,b]=[b,a];lo=Math.max(lo,a);hi=Math.min(hi,b);}\n    }\n    return hi>=lo&&lo>0&&lo<limit?lo:null;\n  };\n  function stereoData(t){\n    const shift=.09*Math.sin(t*TAU);\n    const boxes=[[-1.2+shift,2.7,-.35+shift,3.4,.7],[.85,4.3,1.75,4.9,1.1],[.1,1.4,.95,1.48,.04]];\n    const points=[];\n    for(let row=0;row<95;row++)for(let col=0;col<110;col++){\n      const distance=.36/(.06+row*.0063+.004*Math.sin(col*2.13+row*1.71));\n      const dx=-.60+1.2*col/109+.003*Math.sin(col*1.17+row*2.31),dz=-.36/distance;\n      let nearest=distance, object=-1;\n      boxes.forEach((b,i)=>{const hit=boxHit(dx,1,dz,b,nearest);if(hit!==null){nearest=hit;object=i;}});\n      const x=dx*nearest,y=nearest,z=.36+dz*nearest;\n      const gap=Math.sin(x*5.1+y*.7)*Math.cos(y*3.4-x*.3);\n      if(y<.48||y>6||(gap>.38&&object<0)||(gap>.75&&object>=0))continue;\n      if(y>3.9&&(row+col)%3===0)continue;\n      if(object===2&&col%6!==0)continue;\n      points.push({x,y,z,object});\n    }\n    return {boxes,points};\n  }\n  function rayHit(angle,objects,limit=4){\n    const dx=Math.sin(angle),dy=Math.cos(angle);let nearest=limit,object=null;\n    for(const o of objects){\n      let hit=null;\n      if(o.type==='circle'){\n        const [x,y,r]=o.shape,b=dx*x+dy*y,disc=b*b-(x*x+y*y-r*r);\n        if(disc>=0&&b>0)hit=b-Math.sqrt(disc);\n      }else hit=boxHit(dx,dy,null,o.shape,nearest);\n      if(hit!==null&&hit>0&&hit<nearest){nearest=hit;object=o;}\n    }\n    return {distance:nearest,object,dx,dy};\n  }\n  function targetAt(t){return [1.65*Math.sin(t*TAU),1.65+.15*Math.cos(t*TAU)];}\n  function lidarData(t){\n    const target=targetAt(t);\n    const objects=[{type:'box',shape:[-.45,.8,.45,1.05],id:'occluder'},\n      {type:'box',shape:[-3.2,1,-3,2.2],id:'fence'},\n      {type:'box',shape:[1.5,-2.8,3,-2.55],id:'edge'},\n      {type:'box',shape:[-2.8,-1.5,-.9,-1.25],id:'overhang'},\n      {type:'circle',shape:[2.5,2.25,.5],id:'tree'},\n      {type:'circle',shape:[-.9,3,.42],id:'shrub'},\n      {type:'circle',shape:[2.8,-.5,.5],id:'shrub'},\n      {type:'circle',shape:[-2.55,-.05,.3],id:'shrub'},\n      {type:'circle',shape:[...target,.23],id:'target'}];\n    const rays=[];\n    for(let k=0;k<360;k++){\n      const ray=rayHit(k*TAU/360,objects);\n      // Tiny deterministic range perturbation, never free-space random scatter.\n      const d=ray.distance+(ray.object?.id==='target'?0:.008*Math.sin(k*2.3));\n      rays.push({...ray,x:ray.dx*d,y:ray.dy*d,k});\n    }\n    const visible=rays.some(r=>r.object?.id==='target');\n    return {objects,rays,target,visible};\n  }\n  function line(ctx,points,color,width=1,dash=[]){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.setLineDash([]);}\n  function dot(ctx,x,y,color,r=1.5){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}\n  function text(ctx,label,x,y,color=colors.muted,size=14){ctx.font=`${size}px \"Segoe UI\",Arial,sans-serif`;ctx.fillStyle=color;ctx.fillText(label,x,y);}\n  function outline(ctx,map,b,color,width=1){line(ctx,[map(b[0],b[1]),map(b[2],b[1]),map(b[2],b[3]),map(b[0],b[3]),map(b[0],b[1])],color,width);}\n  function robot(ctx,map,color){const [x,y]=map(0,0);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y-9);ctx.lineTo(x-6,y+4);ctx.lineTo(x+6,y+4);ctx.closePath();ctx.fill();}\n  function plotFrame(ctx,w,h,kind,panel,panels){\n    const left=panel*w/panels,right=(panel+1)*w/panels,pw=w/panels;\n    const preview=h<290;\n    let scale,cx,cy;\n    if(kind==='stereo'){scale=Math.min((pw-38)/7.4,(h-70)/6.6);cx=left+pw/2;cy=h-22;}\n    else{scale=Math.min((pw-40)/8.4,(h-70)/8.4);cx=left+pw/2;cy=(h+32)/2;}\n    const map=(x,y)=>[cx+x*scale,cy-y*scale];\n    ctx.save();ctx.beginPath();ctx.rect(left+1,45,pw-2,h-46);ctx.clip();\n    for(let x=-4;x<=4;x++){line(ctx,[map(x,kind==='stereo'?0:-4),map(x,kind==='stereo'?6:4)],colors.grid);}\n    for(let y=kind==='stereo'?0:-4;y<=(kind==='stereo'?6:4);y++)line(ctx,[map(-4,y),map(4,y)],colors.grid);\n    ctx.restore();\n    if(panel)line(ctx,[[left,20],[left,h-15]],'#263a49');\n    if(!preview){text(ctx,panels===1?'Top view':panel?'Representation':'Observations',left+22,29,colors.text,16);}\n    else text(ctx,kind==='stereo'?'FORWARD / STEREO':'SURROUND / LiDAR',left+20,27,colors.muted,13);\n    return {map,scale,left,pw,preview};\n  }\n  function drawStereo(scene){\n    const {ctx,w,h,t,layers,preview}=scene,panels=!preview&&w>=720?2:1;\n    const {boxes,points}=stereoData(t);\n    for(let panel=0;panel<panels;panel++){\n      const {map,scale,left,pw}=plotFrame(ctx,w,h,'stereo',panel,panels);\n      const frustum=[map(-.6*.48,.48),map(-3.6,6),map(3.6,6),map(.6*.48,.48)];\n      ctx.fillStyle='#13253255';ctx.beginPath();frustum.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();line(ctx,[...frustum,frustum[0]],'#365766');\n      const geometry=layers.geometry&&(panels===1||panel===1);\n      if(layers.points)for(const p of points){const [x,y]=map(p.x,p.y);dot(ctx,x,y,p.object<0?'#466677':geometry?p.object===2?colors.gold:colors.cyan:'#a7bdc7',p.object<0?(preview?.65:.85):(preview?1:1.3));}\n      if(geometry){\n        boxes.slice(0,2).forEach(b=>outline(ctx,map,b,colors.cyan,1.7));\n        const b=boxes[2];line(ctx,[map(b[0],b[1]),map(b[2],b[1])],colors.gold,3,[4,3]);\n        if(!preview){const [x,y]=map(b[2],b[1]);line(ctx,[[x+6,y],[x+18,y-16]],colors.gold);text(ctx,'Thin-obstacle hypothesis',Math.min(x+20,left+pw-190),y-21,colors.gold,14);}\n      }\n      robot(ctx,map,colors.cyan);\n      if(!preview){const [x,y]=map(-2.3,5.7);text(ctx,'Surface gaps & occlusion',x,y,colors.muted,13);}\n    }\n  }\n  function drawLidar(scene){\n    const {ctx,w,h,t,layers,preview}=scene,panels=!preview&&w>=720?2:1;\n    const data=lidarData(t);\n    for(let panel=0;panel<panels;panel++){\n      const {map,scale,left}=plotFrame(ctx,w,h,'lidar',panel,panels),[cx,cy]=map(0,0);\n      for(const r of [2,4]){ctx.beginPath();ctx.strokeStyle='#2b4359';ctx.arc(cx,cy,r*scale,0,TAU);ctx.stroke();}\n      if(layers.rays)for(const ray of data.rays){if(ray.k%10===0)line(ctx,[[cx,cy],map(ray.x,ray.y)],ray.object?'#243e56':'#172837');}\n      if(layers.points)for(const ray of data.rays){if(ray.object)dot(ctx,...map(ray.x,ray.y),ray.object.id==='target'?colors.blue:ray.object.id==='overhang'?colors.gold:'#90abc2',preview?1.2:1.6);}\n      // Ghost outlines describe scene geometry, not unobserved sensor returns.\n      for(const o of data.objects){if(o.type==='box')outline(ctx,map,o.shape,'#3e526188',1);}\n      const tracking=layers.tracks&&(panels===1||panel===1);\n      if(tracking){\n        const path=[];for(let k=45;k>=0;k--)path.push(map(...targetAt(t-k*.002)));\n        line(ctx,path,'#507797',2);\n        const [tx,ty]=map(...data.target);\n        ctx.strokeStyle=colors.blue;ctx.lineWidth=1.7;ctx.setLineDash(data.visible?[]:[4,4]);ctx.strokeRect(tx-14,ty-14,28,28);ctx.setLineDash([]);\n        if(!data.visible)line(ctx,path.slice(-12),colors.blue,2,[4,4]);\n        if(!preview)text(ctx,data.visible?'Track 07':'Track 07 \u00b7 occluded',tx-30,ty-23,colors.blue,14);\n      }\n      robot(ctx,map,colors.text);\n      if(!preview){const [x,y]=map(-2.8,-1.5);text(ctx,'Height structure',Math.max(left+10,x-18),y+24,colors.gold,13);}\n    }\n  }\n  function drawHero(scene){\n    const {ctx,w,h}=scene;\n    const scale=Math.min(w/9.1,h/6),cx=w*.34,cy=h*.85;\n    const iso=(x,y,z=0)=>[cx+(x*.87+y*.39)*scale,cy-(y*.53-x*.23+z)*scale];\n    for(let x=-3;x<=3;x++)line(ctx,[iso(x,0),iso(x,6)],'#223747');\n    for(let y=0;y<=6;y++)line(ctx,[iso(-3,y),iso(3,y)],'#223747');\n    const {boxes,points}=stereoData(.15);\n    for(const p of points){dot(ctx,...iso(p.x,p.y,p.z),p.object<0?'#385568':colors.cyan,p.object<0?.8:1.2);}\n    for(const b of boxes.slice(0,2)){\n      const bottom=[[b[0],b[1],0],[b[2],b[1],0],[b[2],b[3],0],[b[0],b[3],0]];\n      const top=bottom.map(p=>[p[0],p[1],b[4]]);\n      line(ctx,[...top,top[0]].map(p=>iso(...p)),colors.cyan,1.5);\n      line(ctx,[...bottom,bottom[0]].map(p=>iso(...p)),'#3e867f',1);\n      bottom.forEach((p,i)=>line(ctx,[iso(...p),iso(...top[i])],'#3e867f'));\n    }\n    const thin=boxes[2];line(ctx,[iso(thin[0],thin[1],.04),iso(thin[2],thin[1],.04)],colors.gold,2,[3,3]);\n    const origin=iso(0,0);dot(ctx,...origin,colors.text,4);line(ctx,[origin,iso(0,.5)],colors.text,2);\n    text(ctx,'SCENE GEOMETRY',22,30,colors.cyan,13);\n    text(ctx,'Supporting surface',22,h-22,colors.muted,13);\n  }\n  function render(scene){\n    const rect=scene.canvas.getBoundingClientRect();if(rect.width===0)return;\n    scene.w=rect.width;scene.h=rect.height;\n    const ratio=Math.min(window.devicePixelRatio||1,2);\n    const bw=Math.round(rect.width*ratio),bh=Math.round(rect.height*ratio);\n    if(scene.canvas.width!==bw||scene.canvas.height!==bh){scene.canvas.width=bw;scene.canvas.height=bh;}\n    scene.ctx.setTransform(ratio,0,0,ratio,0,0);scene.ctx.clearRect(0,0,scene.w,scene.h);\n    if(scene.kind==='hero')drawHero(scene);else if(scene.kind==='stereo')drawStereo(scene);else drawLidar(scene);\n    if(scene.range)scene.range.value=Math.round(scene.t*1000);\n    if(scene.output)scene.output.textContent=`${(scene.t*12).toFixed(1)} s`;\n  }\n  function setPlaying(scene,playing){\n    scene.playing=playing;\n    if(scene.button){scene.button.textContent=playing?'Pause':'Play';scene.button.setAttribute('aria-pressed',String(!playing));}\n  }\n  for(const canvas of document.querySelectorAll('canvas[data-scene]')){\n    const demo=canvas.closest('[data-demo]'),preview=canvas.dataset.preview==='true';\n    const scene={canvas,ctx:canvas.getContext('2d'),kind:canvas.dataset.scene,preview,t:preview?.18:.05,layers:{points:true,geometry:true,rays:true,tracks:true},playing:!!demo&&!reduced.matches,visible:true};\n    if(demo){\n      scene.button=demo.querySelector('[data-play]');scene.range=demo.querySelector('[data-time]');scene.output=demo.querySelector('[data-time-label]');\n      setPlaying(scene,scene.playing);\n      scene.button.addEventListener('click',()=>setPlaying(scene,!scene.playing));\n      scene.range.addEventListener('input',()=>{setPlaying(scene,false);scene.t=Number(scene.range.value)/1000;render(scene);});\n      for(const input of demo.querySelectorAll('[data-layer]'))input.addEventListener('change',()=>{scene.layers[input.dataset.layer]=input.checked;render(scene);});\n    }\n    scenes.push(scene);render(scene);\n  }\n  const resize=new ResizeObserver(entries=>{for(const entry of entries){const scene=scenes.find(s=>s.canvas===entry.target);if(scene)render(scene);}});\n  const observer=new IntersectionObserver(entries=>{for(const entry of entries){const scene=scenes.find(s=>s.canvas===entry.target);if(scene)scene.visible=entry.isIntersecting;}});\n  scenes.forEach(s=>{resize.observe(s.canvas);observer.observe(s.canvas);});\n  let previous=0;\n  function animate(now){\n    const dt=previous?Math.min((now-previous)/1000,.06):0;previous=now;\n    if(!document.hidden)for(const scene of scenes){if(scene.playing&&scene.visible){scene.t=(scene.t+dt/12)%1;render(scene);}}\n    requestAnimationFrame(animate);\n  }\n  if(scenes.some(s=>s.button))requestAnimationFrame(animate);\n  const mediaDemos=[];\n  for(const demo of document.querySelectorAll('[data-media-demo]')){\n    const button=demo.querySelector('button'),img=demo.querySelector('img');\n    button.addEventListener('click',()=>{const playing=button.getAttribute('aria-pressed')!=='true';img.src=playing?img.dataset.motion:img.dataset.static;button.setAttribute('aria-pressed',String(playing));button.textContent=playing?'Show still frame':'Play illustration';});\n    mediaDemos.push({button,img});\n  }\n  reduced.addEventListener('change',e=>{if(e.matches){scenes.forEach(s=>setPlaying(s,false));mediaDemos.forEach(({button,img})=>{img.src=img.dataset.static;button.setAttribute('aria-pressed','false');button.textContent='Play illustration';});}});\n})();\n<\/script><\/body><\/html>", "projects/stereo.html": "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"dark\"><title>Stereo perception \u2014 Merci<\/title><meta name=\"description\" content=\"A useful representation of thin obstacles, even when depth observations are sparse.\"><link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iIzA5MGQxMiIvPjxwYXRoIGQ9Ik03IDI0VjlsOSA5IDktOXYxNSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNjJlNGQyIiBzdHJva2Utd2lkdGg9IjMiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4K\"><style>@charset \"UTF-8\";\n:root{color-scheme:dark;--bg:#
