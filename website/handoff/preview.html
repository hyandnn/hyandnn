x;font-size:.8rem}.case-head h1{font-size:2.5rem}html:lang(zh-CN) .case-head h1{font-size:2.2rem}}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.project-card{transition:none}.project-card:hover{transform:none}}\n<\/style><\/head><body><a class=\"skip\" href=\"#main\">Skip to content<\/a><header><div class=\"wrap\"><a class=\"brand\" href=\"index.html\" aria-label=\"Merci\">Merci<span>.<\/span><\/a><div class=\"header-right\"><nav aria-label=\"Main navigation\"><a href=\"index.html#work\">Work<\/a><a href=\"index.html#about\">About<\/a><a href=\"index.html#contact\">Contact<\/a><\/nav><div class=\"language-switch\" role=\"group\" aria-label=\"Language\"><a href=\"index.html\" data-set-language=\"en\" lang=\"en\" hreflang=\"en\" aria-label=\"English\" aria-current=\"true\">EN<\/a><a href=\"zh/index.html\" data-set-language=\"zh\" lang=\"zh-CN\" hreflang=\"zh-CN\" aria-label=\"\u7b80\u4f53\u4e2d\u6587\">\u4e2d\u6587<\/a><\/div><\/div><\/div><\/header><main id=\"main\"><section class=\"hero\" aria-labelledby=\"hero-title\"><div><div class=\"eyebrow\">Perception Algorithm Engineer<\/div><h1 id=\"hero-title\">From observations<br>to <span>geometry.<\/span><\/h1><p class=\"intro\">I\u2019m Merci. I build perception software that turns imperfect sensor observations into useful geometry for robots.<\/p><div class=\"hero-actions\"><a class=\"primary-link\" href=\"#work\">Explore selected work<\/a><a class=\"text-link secondary-link\" href=\"https://github.com/hyandnn\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub profile<\/a><\/div><\/div><div class=\"hero-visual\"><div class=\"visual-top\"><span>Scene geometry<\/span><span>Synthetic illustration<\/span><\/div><canvas data-scene=\"hero\" role=\"img\" aria-label=\"Scene geometry\"><\/canvas><div class=\"visual-bottom\"><span>Observations \u2192 representation<\/span><\/div><\/div><\/section><div class=\"info-strip\"><span>Consumer robotics<\/span><span>Multi-sensor fusion<\/span><span>C++ implementation<\/span><\/div><section id=\"work\" aria-labelledby=\"work-title\"><div class=\"section-top\"><div><div class=\"eyebrow\">Selected work / 01\u201404<\/div><h2 id=\"work-title\">Engineering in practice.<\/h2><\/div><p>Four cases, from sparse observations to systems integration.<\/p><\/div><div class=\"work-grid\"><a class=\"project-card \" href=\"projects/stereo.html\"><div class=\"card-view\"><canvas data-scene=\"stereo-cover\" data-preview=\"true\" role=\"img\" aria-label=\"Combining geometric and semantic evidence to represent thin obstacles.\"><\/canvas><\/div><div class=\"card-copy\"><div class=\"card-heading\"><span class=\"index\">01<\/span><h3>Stereo perception<\/h3><\/div><p>Combining geometric and semantic evidence to represent thin obstacles.<\/p><div class=\"card-foot\"><span class=\"mono\">GEOMETRY + SEMANTICS<\/span><span>Read case study<\/span><\/div><\/div><\/a><a class=\"project-card blue\" href=\"projects/lidar.html\"><div class=\"card-view\"><canvas data-scene=\"lidar-cover\" data-preview=\"true\" role=\"img\" aria-label=\"Introducing tracking into an established outdoor perception system.\"><\/canvas><\/div><div class=\"card-copy\"><div class=\"card-heading\"><span class=\"index\">02<\/span><h3>LiDAR perception<\/h3><\/div><p>Introducing tracking into an established outdoor perception system.<\/p><div class=\"card-foot\"><span class=\"mono\">TEMPORAL CONTINUITY<\/span><span>Read case study<\/span><\/div><\/div><\/a><a class=\"project-card gold\" href=\"projects/collision.html\"><div class=\"card-view\"><canvas data-scene=\"collision-cover\" data-preview=\"true\" role=\"img\" aria-label=\"Integrating SAP, a BVH midphase and GJK alongside existing algorithms.\"><\/canvas><\/div><div class=\"card-copy\"><div class=\"card-heading\"><span class=\"index\">03<\/span><h3>Physics simulation<\/h3><\/div><p>Integrating SAP, a BVH midphase and GJK alongside existing algorithms.<\/p><div class=\"card-foot\"><span class=\"mono\">COLLISION DETECTION<\/span><span>Read case study<\/span><\/div><\/div><\/a><a class=\"project-card purple\" href=\"projects/motion.html\"><div class=\"card-view\"><canvas data-scene=\"motion-cover\" data-preview=\"true\" role=\"img\" aria-label=\"Matching changing frame contents to fixed climbing holds on a wall template.\"><\/canvas><\/div><div class=\"card-copy\"><div class=\"card-heading\"><span class=\"index\">04<\/span><h3>Vision-based climbing analysis<\/h3><\/div><p>Matching changing frame contents to fixed climbing holds on a wall template.<\/p><div class=\"card-foot\"><span class=\"mono\">FRAME\u2013TEMPLATE ALIGNMENT<\/span><span>Read case study<\/span><\/div><\/div><\/a><\/div><p class=\"notice\">All visuals are independently created conceptual illustrations using synthetic data. They do not show internal implementations, product recordings or measured research results.<\/p><\/section><section class=\"about\" id=\"about\" aria-labelledby=\"about-title\"><div><div class=\"eyebrow\">About / Merci<\/div><h2 id=\"about-title\">Perception engineer.<br>Robotics background.<\/h2><\/div><div class=\"about-text\"><p>I work in consumer robotics, developing multi-sensor perception with stereo or LiDAR as the leading observation source. My work spans geometric reasoning, model post-processing, tracking and efficient C++ implementation.<\/p><p>I hold an M.Sc. in <b>Robotic Systems Engineering<\/b> from <b>RWTH Aachen University<\/b>. Earlier research involved collision-engine integration and vision-based climbing analysis.<\/p><div class=\"toolkit\"><div><b>Implementation<\/b><p>C++ \u00b7 Python \u00b7 CMake<br>Profiling & runtime optimization<\/p><\/div><div><b>Perception<\/b><p>OpenCV \u00b7 Point clouds<br>Geometry, semantics & tracking<\/p><\/div><div><b>Simulation<\/b><p>Collision detection<br>Spatial hierarchies & integration<\/p><\/div><\/div><p class=\"additional\">Additional research: a small neural-network surrogate for manufacturing simulation, paired with an interactive interface.<\/p><\/div><\/section><section class=\"contact\" id=\"contact\" aria-labelledby=\"contact-title\"><div><div class=\"eyebrow\">Contact<\/div><h2 id=\"contact-title\">Let\u2019s talk engineering.<\/h2><p>Perception, geometry and systems that work in practice.<\/p><\/div><a class=\"text-link\" href=\"mailto:haoling.yang@rwth-aachen.de\">haoling.yang@rwth-aachen.de<\/a><\/section><\/main><footer><div class=\"wrap\"><span>Merci \u00b7 Perception & simulation<\/span><div class=\"footer-links\"><a href=\"https://github.com/hyandnn\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub<\/a><a href=\"mailto:haoling.yang@rwth-aachen.de\">Email<\/a><\/div><\/div><\/footer><script>document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(!h||/^(https?:|mailto:|data:)/.test(h))return;e.preventDefault();parent.postMessage({portfolioNavigation:h},'*');});<\/script><script>/* Independent conceptual scenes. No product data or production implementation. */\n(() => {\n  'use strict';\n  const TAU = Math.PI * 2;\n  const colors = { grid:'#1a2936', muted:'#879cac', point:'#7892a6', cyan:'#62e4d2', blue:'#85bbff', gold:'#f3bf77', text:'#dce7ef' };\n  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');\n  const scenes = [];\n  const language = document.documentElement?.dataset.language === 'zh' ? 'zh' : 'en';\n  const tr = (en,zh) => language==='zh'?zh:en;\n  const canvasFont = '-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"PingFang SC\",\"Microsoft YaHei\",\"Source Han Sans SC\",\"Noto Sans SC\",\"Noto Sans CJK SC\",sans-serif';\n  // Preferences are best-effort: local previews can block browser storage.\n  const storage = { get(){try{return localStorage.getItem('merci-language');}catch{return null;}}, set(v){try{localStorage.setItem('merci-language',v);}catch{}} };\n  function navigateLanguage(href){\n    if(window.parent!==window&&document.URL==='about:srcdoc')window.parent.postMessage({portfolioNavigation:href},'*');\n    else window.location.assign(href);\n  }\n  const languageLinks=[...document.querySelectorAll('[data-set-language]')];\n  for(const a of languageLinks)a.addEventListener('click',()=>{storage.set(a.dataset.setLanguage);if(window.location.hash)a.href+=window.location.hash;});\n  const preferred=storage.get();\n  // Only explicit saved choices redirect; a shared language URL works on first visit.\n  if(preferred&&preferred!==language){const link=languageLinks.find(a=>a.dataset.setLanguage===preferred);if(link)navigateLanguage(link.getAttribute('href'));}\n\n  const boxHit = (dx,dy,dz,box,limit) => {\n    let lo=0, hi=limit;\n    const axes = [[dx,box[0],box[2]],[dy,box[1],box[3]]];\n    if(dz !== null) axes.push([dz,-.36,box[4]-.36]);\n    for(const [v,mn,mx] of axes){\n      if(Math.abs(v)<1e-8){if(!(mn<=0&&0<=mx))return null;}\n      else{let a=mn/v,b=mx/v;if(a>b)[a,b]=[b,a];lo=Math.max(lo,a);hi=Math.min(hi,b);}\n    }\n    return hi>=lo&&lo>0&&lo<limit?lo:null;\n  };\n  function stereoData(t){\n    const shift=.09*Math.sin(t*TAU);\n    const boxes=[[-1.2+shift,2.7,-.35+shift,3.4,.7],[.85,4.3,1.75,4.9,1.1],[.1,1.4,.95,1.48,.04]];\n    const points=[];\n    for(let row=0;row<95;row++)for(let col=0;col<110;col++){\n      const distance=.36/(.06+row*.0063+.004*Math.sin(col*2.13+row*1.71));\n      const dx=-.60+1.2*col/109+.003*Math.sin(col*1.17+row*2.31),dz=-.36/distance;\n      let nearest=distance, object=-1;\n      boxes.forEach((b,i)=>{const hit=boxHit(dx,1,dz,b,nearest);if(hit!==null){nearest=hit;object=i;}});\n      const x=dx*nearest,y=nearest,z=.36+dz*nearest;\n      const gap=Math.sin(x*5.1+y*.7)*Math.cos(y*3.4-x*.3);\n      if(y<.48||y>6||(gap>.38&&object<0)||(gap>.75&&object>=0))continue;\n      if(y>3.9&&(row+col)%3===0)continue;\n      if(object===2&&col%6!==0)continue;\n      points.push({x,y,z,object});\n    }\n    return {boxes,points};\n  }\n  function rayHit(angle,objects,limit=4){\n    const dx=Math.sin(angle),dy=Math.cos(angle);let nearest=limit,object=null;\n    for(const o of objects){\n      let hit=null;\n      if(o.type==='circle'){\n        const [x,y,r]=o.shape,b=dx*x+dy*y,disc=b*b-(x*x+y*y-r*r);\n        if(disc>=0&&b>0)hit=b-Math.sqrt(disc);\n      }else hit=boxHit(dx,dy,null,o.shape,nearest);\n      if(hit!==null&&hit>0&&hit<nearest){nearest=hit;object=o;}\n    }\n    return {distance:nearest,object,dx,dy};\n  }\n  function targetAt(t){return [1.65*Math.sin(t*TAU),1.65+.15*Math.cos(t*TAU)];}\n  function lidarData(t){\n    const target=targetAt(t);\n    const objects=[{type:'box',shape:[-.45,.8,.45,1.05],id:'occluder'},\n      {type:'box',shape:[-3.2,1,-3,2.2],id:'fence'},\n      {type:'box',shape:[1.5,-2.8,3,-2.55],id:'edge'},\n      {type:'box',shape:[-2.8,-1.5,-.9,-1.25],id:'overhang'},\n      {type:'circle',shape:[2.5,2.25,.5],id:'tree'},\n      {type:'circle',shape:[-.9,3,.42],id:'shrub'},\n      {type:'circle',shape:[2.8,-.5,.5],id:'shrub'},\n      {type:'circle',shape:[-2.55,-.05,.3],id:'shrub'},\n      {type:'circle',shape:[...target,.23],id:'target'}];\n    const rays=[];\n    for(let k=0;k<360;k++){\n      const ray=rayHit(k*TAU/360,objects);\n      // Tiny deterministic range perturbation, never free-space random scatter.\n      const d=ray.distance+(ray.object?.id==='target'?0:.008*Math.sin(k*2.3));\n      rays.push({...ray,x:ray.dx*d,y:ray.dy*d,k});\n    }\n    const visible=rays.some(r=>r.object?.id==='target');\n    return {objects,rays,target,visible};\n  }\n  function line(ctx,points,color,width=1,dash=[]){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.setLineDash([]);}\n  function dot(ctx,x,y,color,r=1.5){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}\n  function text(ctx,label,x,y,color=colors.muted,size=14){ctx.font=`${size}px ${canvasFont}`;ctx.fillStyle=color;ctx.fillText(label,x,y);}\n  function outline(ctx,map,b,color,width=1){line(ctx,[map(b[0],b[1]),map(b[2],b[1]),map(b[2],b[3]),map(b[0],b[3]),map(b[0],b[1])],color,width);}\n  function robot(ctx,map,color){const [x,y]=map(0,0);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y-9);ctx.lineTo(x-6,y+4);ctx.lineTo(x+6,y+4);ctx.closePath();ctx.fill();}\n  function plotFrame(ctx,w,h,kind,panel,panels){\n    const left=panel*w/panels,right=(panel+1)*w/panels,pw=w/panels;\n    const preview=h<290;\n    let scale,cx,cy;\n    if(kind==='stereo'){scale=Math.min((pw-38)/7.4,(h-70)/6.6);cx=left+pw/2;cy=h-22;}\n    else{scale=Math.min((pw-40)/8.4,(h-70)/8.4);cx=left+pw/2;cy=(h+32)/2;}\n    const map=(x,y)=>[cx+x*scale,cy-y*scale];\n    ctx.save();ctx.beginPath();ctx.rect(left+1,45,pw-2,h-46);ctx.clip();\n    for(let x=-4;x<=4;x++){line(ctx,[map(x,kind==='stereo'?0:-4),map(x,kind==='stereo'?6:4)],colors.grid);}\n    for(let y=kind==='stereo'?0:-4;y<=(kind==='stereo'?6:4);y++)line(ctx,[map(-4,y),map(4,y)],colors.grid);\n    ctx.restore();\n    if(panel)line(ctx,[[left,20],[left,h-15]],'#263a49');\n    if(!preview){text(ctx,panels===1?tr('Top view','\u4fef\u89c6\u56fe'):panel?tr('Representation','\u51e0\u4f55\u8868\u793a'):tr('Observations','\u89c2\u6d4b\u70b9'),left+22,29,colors.text,16);}\n    else text(ctx,kind==='stereo'?tr('FORWARD / STEREO','\u524d\u5411 / \u53cc\u76ee'):tr('RETURNS + TRACK','\u56de\u6ce2 + \u8f68\u8ff9'),left+20,27,colors.muted,13);\n    return {map,scale,left,pw,preview};\n  }\n  function drawStereo(scene){\n    const {ctx,w,h,t,layers,preview}=scene,panels=!preview&&w>=720?2:1;\n    const {boxes,points}=stereoData(t);\n    for(let panel=0;panel<panels;panel++){\n      const {map,scale,left,pw}=plotFrame(ctx,w,h,'stereo',panel,panels);\n      const frustum=[map(-.6*.48,.48),map(-3.6,6),map(3.6,6),map(.6*.48,.48)];\n      ctx.fillStyle='#13253255';ctx.beginPath();frustum.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();line(ctx,[...frustum,frustum[0]],'#365766');\n      const geometry=layers.geometry&&(panels===1||panel===1);\n      if(layers.points)for(const p of points){const [x,y]=map(p.x,p.y);dot(ctx,x,y,p.object<0?'#466677':geometry?p.object===2?colors.gold:colors.cyan:'#a7bdc7',p.object<0?(preview?.65:.85):(preview?1:1.3));}\n      if(geometry){\n        boxes.slice(0,2).forEach(b=>outline(ctx,map,b,colors.cyan,1.7));\n        const b=boxes[2];line(ctx,[map(b[0],b[1]),map(b[2],b[1])],colors.gold,3,[4,3]);\n        if(!preview){const [x,y]=map(b[2],b[1]);line(ctx,[[x+6,y],[x+18,y-16]],colors.gold);const label=tr('Inferred thin geometry','\u7ec6\u5c0f\u969c\u788d\u7269\u63a8\u65ad');text(ctx,label,Math.max(left+10,Math.min(x+20,left+pw-(language==='zh'?145:165))),y-21,colors.gold,14);}\n      }\n      robot(ctx,map,colors.cyan);\n      if(!preview){const [x,y]=map(-2.3,5.7);text(ctx,tr('Gaps & occlusion','\u7f3a\u5931\u4e0e\u906e\u6321'),x,y,colors.muted,13);}\n    }\n  }\n  function drawLidar(scene){\n    const {ctx,w,h,t,layers,preview}=scene,panels=!preview&&w>=720?2:1;\n    const data=lidarData(t);\n    for(let panel=0;panel<panels;panel++){\n      const {map,scale,left}=plotFrame(ctx,w,h,'lidar',panel,panels),[cx,cy]=map(0,0);\n      for(const r of [2,4]){ctx.beginPath();ctx.strokeStyle='#2b4359';ctx.arc(cx,cy,r*scale,0,TAU);ctx.stroke();}\n      if(layers.rays)for(const ray of data.rays){if(ray.k%10===0)line(ctx,[[cx,cy],map(ray.x,ray.y)],ray.object?'#243e56':'#172837');}\n      if(layers.points)for(const ray of data.rays){if(ray.object)dot(ctx,...map(ray.x,ray.y),ray.object.id==='target'?colors.blue:ray.object.id==='overhang'?colors.gold:'#90abc2',preview?1.2:1.6);}\n      // Ghost outlines describe scene geometry, not unobserved sensor returns.\n      for(const o of data.objects){if(o.type==='box')outline(ctx,map,o.shape,'#3e526188',1);}\n      const tracking=layers.tracks&&(panels===1||panel===1);\n      if(tracking){\n        const path=[];for(let k=45;k>=0;k--)path.push(map(...targetAt(t-k*.002)));\n        line(ctx,path,'#507797',2);\n        const [tx,ty]=map(...data.target);\n        ctx.strokeStyle=colors.blue;ctx.lineWidth=1.7;ctx.setLineDash(data.visible?[]:[4,4]);ctx.strokeRect(tx-14,ty-14,28,28);ctx.setLineDash([]);\n        if(!data.visible)line(ctx,path.slice(-12),colors.blue,2,[4,4]);\n        if(!preview)text(ctx,data.visible?tr('Track 07','\u76ee\u6807 07'):tr('Track 07 \u00b7 occluded','\u76ee\u6807 07 \u00b7 \u906e\u6321'),tx-30,ty-23,colors.blue,14);\n      }\n      robot(ctx,map,colors.text);\n      if(!preview){const [x,y]=map(-2.8,-1.5);text(ctx,tr('Height structure','\u9ad8\u5ea6\u7ed3\u6784'),Math.max(left+10,x-18),y+24,colors.gold,13);}\n    }\n  }\n  function drawHero(scene){\n    const {ctx,w,h}=scene;\n    const scale=Math.min(w/9.1,h/6),cx=w*.34,cy=h*.85;\n    const iso=(x,y,z=0)=>[cx+(x*.87+y*.39)*scale,cy-(y*.53-x*.23+z)*scale];\n    for(let x=-3;x<=3;x++)line(ctx,[iso(x,0),iso(x,6)],'#223747');\n    for(let y=0;y<=6;y++)line(ctx,[iso(-3,y),iso(3,y)],'#223747');\n    const {boxes,points}=stereoData(.15);\n    for(const p of points){dot(ctx,...iso(p.x,p.y,p.z),p.object<0?'#385568':colors.cyan,p.object<0?.8:1.2);}\n    for(const b of boxes.slice(0,2)){\n      const bottom=[[b[0],b[1],0],[b[2],b[1],0],[b[2],b[3],0],[b[0],b[3],0]];\n      const top=bottom.map(p=>[p[0],p[1],b[4]]);\n      line(ctx,[...top,top[0]].map(p=>iso(...p)),colors.cyan,1.5);\n      line(ctx,[...bottom,bottom[0]].map(p=>iso(...p)),'#3e867f',1);\n      bottom.forEach((p,i)=>line(ctx,[iso(...p),iso(...top[i])],'#3e867f'));\n    }\n    const thin=boxes[2];line(ctx,[iso(thin[0],thin[1],.04),iso(thin[2],thin[1],.04)],colors.gold,2,[3,3]);\n    const origin=iso(0,0);dot(ctx,...origin,colors.text,4);line(ctx,[origin,iso(0,.5)],colors.text,2);\n    text(ctx,tr('SCENE GEOMETRY','\u573a\u666f\u51e0\u4f55'),22,30,colors.cyan,13);\n    text(ctx,tr('Supporting surface','\u652f\u6491\u5e73\u9762'),22,h-22,colors.muted,13);\n  }\n  function grid(ctx,w,h,step=28){for(let x=18;x<w;x+=step)line(ctx,[[x,45],[x,h-18]],colors.grid);for(let y=45;y<h-18;y+=step)line(ctx,[[18,y],[w-18,y]],colors.grid);}\n  function polygon(ctx,points,color,fill){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}ctx.strokeStyle=color;ctx.lineWidth=1.6;ctx.stroke();}\n  function drawStereoCover(scene){\n    const {ctx,w,h}=scene;grid(ctx,w,h);\n    const sx=(w-76)/1.7,sy=(h-70)/1.5,map=(x,y)=>[38+(x+.25)*sx,h-22-(y-.6)*sy];\n    ctx.save();ctx.beginPath();ctx.rect(18,45,w-36,h-63);ctx.clip();\n    for(const p of stereoData(.2).points){if(p.x>=-.25&&p.x<=1.45&&p.y>=.6&&p.y<=2.1)dot(ctx,...map(p.x,p.y),p.object===2?colors.gold:'#476877',p.object===2?2:1);}\n    line(ctx,[map(.1,1.4),map(.95,1.4)],colors.gold,3,[6,5]);ctx.restore();\n    text(ctx,tr('SPARSE POINTS / GEOMETRY','\u7a00\u758f\u89c2\u6d4b / \u63a8\u65ad\u51e0\u4f55'),20,27,colors.cyan,13);\n    const [x,y]=map(.45,1.4);text(ctx,tr('Thin obstacle','\u7ec6\u5c0f\u969c\u788d\u7269'),Math.max(20,x-35),y-16,colors.gold,14);\n  }\n  function collisionShapes(t){return [[.26+.04*Math.sin(t*TAU),.45,.25,.29],[.46,.48,.25,.29],[.78,.32,.19,.23],[.76,.76,.16,.16]];}\n  function drawCollision(scene){\n    const {ctx,w,h,t}=scene,panel=scene.panel||0;grid(ctx,w,h);\n    const map=(x,y)=>[22+x*(w-44),h-30-y*(h-82)];\n    if(panel===0){\n      text(ctx,tr('POTENTIAL PAIRS','\u6f5c\u5728\u5bf9\u8c61\u5bf9'),20,28,colors.gold,13);\n      const shapes=collisionShapes(t);\n      shapes.forEach((b,i)=>{const [x,y,bw,bh]=b,p=[map(x-bw/2,y-bh/2),map(x+bw/2,y-bh/2),map(x+bw/2,y+bh/2),map(x-bw/2,y+bh/2)];polygon(ctx,p,i<2?colors.gold:'#607d90',i<2?'#f3bf7712':'#40576910');\n        const inner=p.map(([px,py])=>[(px+map(x,y)[0])/2,(py+map(x,y)[1])/2]);polygon(ctx,inner,i<2?'#c1a57f':'#627a8a');\n      });\n      const a=shapes[0],b=shapes[1];line(ctx,[map(a[0],a[1]),map(b[0],b[1])],colors.gold,2,[4,4]);\n      const base=h-22;line(ctx,[[30,base],[w-28,base]],'#507082');\n      shapes.slice(0,3).forEach((s,i)=>{const x0=map(s[0]-s[2]/2,0)[0],x1=map(s[0]+s[2]/2,0)[0];line(ctx,[[x0,base-6-i*6],[x1,base-6-i*6]],i<2?colors.gold:'#607d90',3);});\n    }else if(panel===1){\n      text(ctx,tr('HIERARCHICAL BOUNDS','\u5c42\u6b21\u5305\u56f4\u7ed3\u6784'),20,28,colors.gold,13);\n      const root=[map(.1,.1),map(.9,.1),map(.9,.92),map(.1,.92)];line(ctx,[...root,root[0]],'#557083',1,[4,4]);\n      for(let i=0;i<2;i++){\n        const x0=.17+i*.37,x1=x0+.29;const b=[map(x0,.18),map(x1,.18),map(x1,.84),map(x0,.84)];polygon(ctx,b,i===0?colors.gold:'#577284',i===0?'#f3bf7709':undefined);\n        for(let j=0;j<3;j++){const y=.27+j*.22;const tri=[map(x0+.035,y),map(x1-.025,y+.12),map(x0+.08,y+.17)];polygon(ctx,tri,i===0&&j===1?colors.gold:'#597485');}\n      }\n      text(ctx,tr('Selected region','\u9009\u4e2d\u7684\u51e0\u4f55\u533a\u57df'),22,h-9,colors.muted,13);\n    }else{\n      text(ctx,tr('CONVEX GEOMETRY QUERY','\u51f8\u51e0\u4f55\u67e5\u8be2'),20,28,colors.gold,13);\n      const a=[[.12,.35],[.30,.22],[.43,.4],[.32,.62],[.13,.62]].map(p=>map(...p));\n      const b=[[.60,.31],[.84,.34],[.87,.64],[.68,.73],[.54,.53]].map(p=>map(...p));\n      polygon(ctx,a,colors.gold,'#f3bf7710');polygon(ctx,b,'#9cadbd','#94aabd0a');\n      const pa=a.reduce((best,p)=>p[0]>best[0]?p:best),pb=b.reduce((best,p)=>p[0]<best[0]?p:best);\n      dot(ctx,...pa,colors.gold,4);dot(ctx,...pb,colors.gold,4);line(ctx,[pa,pb],colors.gold,1.5,[4,4]);\n      line(ctx,[map(.18,.12),map(.80,.12)],'#9a815d',1);\n      text(ctx,tr('Support direction','\u652f\u6491\u67e5\u8be2\u65b9\u5411'),22,h-9,colors.muted,13);\n    }\n  }\n  // The world holds are immutable. Only the camera window and climber move.\n  const wallHolds=Object.freeze(Array.from({length:24},(_,i)=>Object.freeze({id:i+1,x:[.17,.48,.81][i%3]+.035*Math.sin(i*1.9),y:.055+Math.floor(i/3)*.125+.017*Math.sin(i*2.1)})));\n  function climberAt(t){return [.47+.05*Math.sin(t*TAU*2),.15+.67*t+.008*Math.sin(t*TAU*2)];}\n  function speedAt(t){const c=Math.cos(t*TAU*2);return Math.hypot(.05*TAU*2*c,.67+.008*TAU*2*c)/12;}\n  function poseAt(t){\n    const [x,y]=climberAt(t),s=.015*Math.sin(t*TAU*3);\n    const p={hip:[x,y],shoulder:[x,y+.047],head:[x,y+.084],le:[x-.064,y+.04+s],lh:[x-.11,y+.088+s],re:[x+.062,y+.034-s],rh:[x+.10,y+.081-s],lk:[x-.025,y-.04+s/2],lf:[x-.06,y-.077],rk:[x+.03,y-.043-s/2],rf:[x+.061,y-.082]};\n    return {points:p,edges:[['hip','shoulder'],['shoulder','head'],['shoulder','le'],['le','lh'],['shoulder','re'],['re','rh'],['hip','lk'],['lk','lf'],['hip','rk'],['rk','rf']]};\n  }\n  function motionData(t){\n    const window={x:.05,y:.02+.66*t,w:.90,h:.30};\n    const visible=wallHolds.filter(p=>p.x>=window.x&&p.x<=window.x+window.w&&p.y>=window.y&&p.y<=window.y+window.h);\n    const local=p=>[(p[0]-window.x)/window.w,(p[1]-window.y)/window.h];\n    return {window,holds:wallHolds,visible,local,climber:climberAt(t),pose:poseAt(t),matches:[visible[0],visible[Math.floor(visible.length/2)],visible[visible.length-1]].filter(Boolean)};\n  }\n  function drawPose(ctx,map,pose,width=2){for(const [a,b] of pose.edges)line(ctx,[map(...pose.points[a]),map(...pose.points[b])],'#e4e1ef',width);dot(ctx,...map(...pose.points.head),'#e4e1ef',width*1.6);dot(ctx,...map(...pose.points.hip),colors.purple||'#c4aaff',width*1.4);}\n  function drawMotion(scene){\n    const {ctx,w,h,t}=scene,panel=scene.panel||0,data=motionData(t),accent='#c4aaff';\n    grid(ctx,w,h);\n    if(panel===0){\n      text(ctx,tr('LOCAL FRAME COORDINATES','\u753b\u9762\u5c40\u90e8\u5750\u6807'),18,28,accent,13);\n      const bw=Math.min(w-48,(h-78)*.9/.78),bh=bw*.78/.9,x0=(w-bw)/2,y0=50+(h-65-bh)/2;\n      const map=(x,y)=>[x0+x*bw,y0+(1-y)*bh];\n      polygon(ctx,[[x0,y0],[x0+bw,y0],[x0+bw,y0+bh],[x0,y0+bh]],accent,'#c4aaff09');\n      for(const p of data.visible){const match=data.matches.some(m=>m.id===p.id);dot(ctx,...map(...data.local([p.x,p.y])),match?colors.gold:'#a493bc',match?4:3);}\n      drawPose(ctx,(x,y)=>map(...data.local([x,y])),data.pose,2);\n    }else if(panel===1){\n      const ww=Math.min(w*.25,(h-62)/2.6),wh=ww*2.6,wx=w*.71-ww/2,wy=48;\n      const map=(x,y)=>[wx+x*ww,wy+(1-y)*wh];\n      const fw=Math.min(w*.33,120),fh=fw*.78/.9,fx=18,fy=h*.45-fh/2;\n      const localMap=(x,y)=>[fx+x*fw,fy+(1-y)*fh];\n      text(ctx,tr('Frame','\u5f53\u524d\u753b\u9762'),fx,fy-13,accent,14);text(ctx,tr('Fixed template','\u56fa\u5b9a\u6a21\u677f'),Math.max(wx-14,w*.50),30,accent,14);\n      polygon(ctx,[[wx,wy],[wx+ww,wy],[wx+ww,wy+wh],[wx,wy+wh]],'#685b82','#c4aaff05');\n      polygon(ctx,[[fx,fy],[fx+fw,fy],[fx+fw,fy+fh],[fx,fy+fh]],accent,'#c4aaff06');\n      for(const p of data.holds)dot(ctx,...map(p.x,p.y),'#665e78',2.6);\n      const win=data.window;\n      const rect=[map(win.x,win.y),map(win.x+win.w,win.y),map(win.x+win.w,win.y+win.h),map(win.x,win.y+win.h)];\n      polygon(ctx,rect,accent,'#c4aaff16');\n      for(const p of data.visible)dot(ctx,...localMap(...data.local([p.x,p.y])),'#9689ad',2.4);\n      for(const p of data.matches){const a=localMap(...data.local([p.x,p.y])),b=map(p.x,p.y);line(ctx,[a,b],'#b49a655f',1,[3,4]);dot(ctx,...a,colors.gold,3.5);dot(ctx,...b,colors.gold,3.5);}\n      const ax=wx+ww+12;line(ctx,[[ax,wy+wh*.75],[ax,wy+wh*.40]],accent,1.3);line(ctx,[[ax-3,wy+wh*.43],[ax,wy+wh*.40],[ax+3,wy+wh*.43]],accent,1.3);\n    }else{\n      text(ctx,tr('Aligned trajectory','\u5bf9\u9f50\u540e\u7684\u8f68\u8ff9'),18,25,accent,14);\n      const top=44,bottom=h*.53,ww=Math.min(w*.32,105),wx=(w-ww)/2;\n      const map=(x,y)=>[wx+x*ww,bottom-y*(bottom-top)];\n      polygon(ctx,[[wx,top],[wx+ww,top],[wx+ww,bottom],[wx,bottom]],'#514b64');\n      for(const p of data.holds)dot(ctx,...map(p.x,p.y),'#514b64',1.7);\n      const trail=[];for(let i=0;i<=80;i++)trail.push(map(...climberAt(t*i/80)));line(ctx,trail,accent,2);dot(ctx,...map(...data.climber),colors.text,3.5);\n      const gx=45,gy=h*.69,gw=w-65,gh=h*.20;\n      text(ctx,tr('Speed (normalized/s)','\u901f\u5ea6\uff08\u5f52\u4e00\u5316 x*ww,wy+(1-y)*wh];\n      const fw=Math.min(w*.33,120),fh=fw*.78/.9,fx=18,fy=h*.45-fh/2;\n      const localMap=(x,y)=>[fx+x*fw,fy+(1-y)*fh];\n      text(ctx,tr('Frame','\u5f53\u524d\u753b\u9762'),fx,fy-13,accent,14);text(ctx,tr('Fixed template','\u56fa\u5b9a\u6a21\u677f'),Math.max(wx-14,w*.50),30,accent,14);\n      polygon(ctx,[[wx,wy],[wx+ww,wy],[wx+ww,wy+wh],[wx,wy+wh]],'#685b82','#c4aaff05');\n      polygon(ctx,[[fx,fy],[fx+fw,fy],[fx+fw,fy+fh],[fx,fy+fh]],accent,'#c4aaff06');\n      for(const p of data.holds)dot(ctx,...map(p.x,p.y),'#665e78',2.6);\n      const win=data.window;\n      const rect=[map(win.x,win.y),map(win.x+win.w,win.y),map(win.x+win.w,win.y+win.h),map(win.x,win.y+win.h)];\n      polygon(ctx,rect,accent,'#c4aaff16');\n      for(const p of data.visible)dot(ctx,...localMap(...data.local([p.x,p.y])),'#9689ad',2.4);\n      for(const p of data.matches){const a=localMap(...data.local([p.x,p.y])),b=map(p.x,p.y);line(ctx,[a,b],'#b49a655f',1,[3,4]);dot(ctx,...a,colors.gold,3.5);dot(ctx,...b,colors.gold,3.5);}\n      const ax=wx+ww+12;line(ctx,[[ax,wy+wh*.75],[ax,wy+wh*.40]],accent,1.3);line(ctx,[[ax-3,wy+wh*.43],[ax,wy+wh*.40],[ax+3,wy+wh*.43]],accent,1.3);\n    }else{\n      text(ctx,tr('Aligned trajectory','\u5bf9\u9f50\u540e\u7684\u8f68\u8ff9'),18,25,accent,14);\n      const top=44,bottom=h*.53,ww=Math.min(w*.32,105),wx=(w-ww)/2;\n      const map=(x,y)=>[wx+x*ww,bottom-y*(bottom-top)];\n      polygon(ctx,[[wx,top],[wx+ww,top],[wx+ww,bottom],[wx,bottom]],'#514b64');\n      for(const p of data.holds)dot(ctx,...map(p.x,p.y),'#514b64',1.7);\n      const trail=[];for(let i=0;i<=80;i++)trail.push(map(...climberAt(t*i/80)));line(ctx,trail,accent,2);dot(ctx,...map(...data.climber),colors.text,3.5);\n      const gx=45,gy=h*.69,gw=w-65,gh=h*.20;\n      text(ctx,tr('Speed (normalized/s)','\u901f\u5ea6\uff08\u5f52\u4e00\u5316\u5750\u6807/\u79d2\uff09'),18,gy-13,accent,13);\n      line(ctx,[[gx,gy],[gx,gy+gh],[gx+gw,gy+gh]],'#6b7385');\n      text(ctx,'0.1',13,gy+4,colors.muted,12);text(ctx,'0',26,gy+gh+3,colors.muted,12);\n      const samples=[];for(let i=0;i<=100;i++)samples.push([gx+gw*i/100,gy+gh-speedAt(i/100)/.1*gh]);line(ctx,samples,'#7d699f',1.4);\n      const active=samples.slice(0,Math.floor(t*100)+1);if(active.length>1)line(ctx,active,accent,2);\n      dot(ctx,gx+gw*t,gy+gh-speedAt(t)/.1*gh,colors.text,3);\n      text(ctx,'0',gx-2,gy+gh+16,colors.muted,12);text(ctx,'12',gx+gw-12,gy+gh+16,colors.muted,12);\n      text(ctx,tr('Synthetic time (s)','\u793a\u610f\u65f6\u95f4\uff08\u79d2\uff09'),Math.max(gx+22,(w-140)/2),h-5,colors.muted,12);\n    }\n  }\n  function drawMotionCover(scene){\n    const {ctx,w,h}=scene,data=motionData(.42),accent='#c4aaff';grid(ctx,w,h);\n    text(ctx,tr('FIXED WALL / MOVING WINDOW','\u56fa\u5b9a\u5899\u70b9 / \u79fb\u52a8\u7a97\u53e3'),20,27,accent,13);\n    // A dedicated composition: full template and its current camera window.\n    const wh=h-62,ww=wh/2.1,wx=w*.51-ww/2,wy=45,map=(x,y)=>[wx+x*ww,wy+(1-y)*wh];\n    polygon(ctx,[[wx,wy],[wx+ww,wy],[wx+ww,wy+wh],[wx,wy+wh]],'#695d82','#c4aaff05');\n    for(const p of data.holds)dot(ctx,...map(p.x,p.y),data.visible.some(v=>v.id===p.id)?colors.gold:'#7e7193',2.6);\n    const q=data.window;polygon(ctx,[map(q.x,q.y),map(q.x+q.w,q.y),map(q.x+q.w,q.y+q.h),map(q.x,q.y+q.h)],accent,'#c4aaff15');\n    drawPose(ctx,map,data.pose,1.8);\n    const [px,py]=map(.97,q.y+q.h/2);line(ctx,[[px+12,py+14],[px+12,py-18]],accent,1.4);line(ctx,[[px+9,py-15],[px+12,py-18],[px+15,py-15]],accent,1.4);\n  }\n  function render(scene){\n    const rect=scene.canvas.getBoundingClientRect();if(rect.width===0)return;\n    scene.w=rect.width;scene.h=rect.height;\n    const ratio=Math.min(window.devicePixelRatio||1,2),bw=Math.round(rect.width*ratio),bh=Math.round(rect.height*ratio);\n    if(scene.canvas.width!==bw||scene.canvas.height!==bh){scene.canvas.width=bw;scene.canvas.height=bh;}\n    scene.ctx.setTransform(ratio,0,0,ratio,0,0);scene.ctx.clearRect(0,0,scene.w,scene.h);\n    scene.t=scene.group?scene.group.t:scene.t;\n    const draw={hero:drawHero,stereo:drawStereo,lidar:drawLidar,collision:drawCollision,motion:drawMotion,'stereo-cover':drawStereoCover,'lidar-cover':drawLidar,'collision-cover':drawCollision,'motion-cover':drawMotionCover}[scene.kind];\n    if(draw)draw(scene);\n  }\n  function setPlaying(group,playing){\n    group.playing=playing;\n    if(group.button){group.button.textContent=playing?tr('Pause','\u6682\u505c'):tr('Play','\u64ad\u653e');group.button.setAttribute('aria-label',group.button.textContent);}\n  }\n  function renderGroup(group){for(const scene of group.scenes)render(scene);group.range.value=Math.round(group.t*1000);group.output.textContent=`${(group.t*12).toFixed(1)} s`;}\n  const groups=[];\n  for(const demo of document.querySelectorAll('[data-demo]')){\n    const group={demo,t:0,playing:false,scenes:[],layers:{points:true,geometry:true,rays:true,tracks:true},button:demo.querySelector('[data-play]'),range:demo.querySelector('[data-time]'),output:demo.querySelector('[data-time-label]')};\n    groups.push(group);setPlaying(group,false);\n    group.button.addEventListener('click',()=>setPlaying(group,!group.playing));\n    group.range.addEventListener('input',()=>{setPlaying(group,false);group.t=Number(group.range.value)/1000;renderGroup(group);});\n    for(const input of demo.querySelectorAll('[data-layer]'))input.addEventListener('change',()=>{group.layers[input.dataset.layer]=input.checked;renderGroup(group);});\n  }\n  for(const canvas of document.querySelectorAll('canvas[data-scene]')){\n    const group=groups.find(g=>g.demo===canvas.closest('[data-demo]'));\n    const scene={canvas,ctx:canvas.getContext('2d'),kind:canvas.dataset.scene,panel:Number(canvas.dataset.panel||0),preview:canvas.dataset.preview==='true',t:.25,layers:group?.layers||{points:true,geometry:true,rays:true,tracks:true},visible:true,group};\n    if(group)group.scenes.push(scene);scenes.push(scene);render(scene);\n  }\n  const resize=new ResizeObserver(entries=>{for(const entry of entries){const scene=scenes.find(s=>s.canvas===entry.target);if(scene)render(scene);}});\n  const observer=new IntersectionObserver(entries=>{for(const entry of entries){const scene=scenes.find(s=>s.canvas===entry.target);if(scene)scene.visible=entry.isIntersecting;}});\n  scenes.forEach(s=>{resize.observe(s.canvas);observer.observe(s.canvas);});groups.forEach(renderGroup);\n  let previous=0;\n  function animate(now){\n    if(now-previous>=32){const dt=previous?Math.min((now-previous)/1000,.1):0;previous=now;\n      if(!document.hidden)for(const group of groups)if(group.playing&&group.scenes.some(s=>s.visible)){group.t+=dt/12;if(group.t>=1){group.t=1;setPlaying(group,false);}renderGroup(group);}\n    }\n    requestAnimationFrame(animate);\n  }\n  // One upward scan finishes at the top; no artificial downward reset.\n  for(const group of groups)group.button.addEventListener('click',()=>{if(group.playing&&group.t>=1){group.t=0;renderGroup(group);}});\n  if(groups.length)requestAnimationFrame(animate);\n  reduced.addEventListener('change',e=>{if(e.matches)groups.forEach(g=>setPlaying(g,false));});\n})();\n<\/script><\/body><\/html>", "projects/collision.html": "<!doctype html><html lang=\"en\" data-route=\"projects/collision.html\" data-language=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"dark\"><title>Physics simulation \u2014 Merci<\/title><meta name=\"description\" content=\"Integrating SAP, a BVH midphase and GJK alongside existing algorithms.\"><link rel=\"alternate\" hreflang=\"zh-CN\" href=\"../zh/projects/collision.html\"><link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iIzA5MGQxMiIvPjxwYXRoIGQ9Ik03IDI0VjlsOSA5IDktOXYxNSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNjJlN 3px;width:1px;height:12px}.method-flow h3{margin:4px 0}.info-strip{gap:8px 14px;font-size:.8rem}.info-strip span+span{padding-left:14px}.toolkit{gap:18px}.contact{margin-bottom:45px}.contact a{font-size:.9rem}.case-nav a{font-size:.9rem}.case-nav{gap:20px}footer .wrap{flex-direction:column;gap:12px}.hero-actions{gap:18px}.hero .intro{font-size:1.05rem}.visual-top{font-size:.8rem}.notice{font-size:.8rem}}\n@media(max-width:480px){.hero-visual{display:none}header .wrap{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding-block:10px}.header-right{display:contents}.language-switch{grid-column:2;grid-row:1}.brand{grid-column:1;grid-row:1;font-size:1.5rem}nav{grid-column:1/-1;grid-row:2;justify-content:space-between;gap:24px;font-size:.875rem}.language-switch a{min-height:32px;padding:3px 12px}.hero h1{font-size:clamp(2.3rem,9vw,3rem)}html:lang(zh-CN) .hero h1{font-size:clamp(2.2rem,9vw,2.9rem)}.hero-actions .primary-link{padding-inline:16px}.info-strip span{border:0!important;padding:0!important}.info-strip{justify-content:space-between;gap:8px;font-size:.8rem}.case-head h1{font-size:2.5rem}html:lang(zh-CN) .case-head h1{font-size:2.2rem}}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.project-card{transition:none}.project-card:hover{transform:none}}\n<\/style><\/head><body><a class=\"skip\" href=\"#main\">Skip to content<\/a><header><div class=\"wrap\"><a class=\"brand\" href=\"../index.html\" aria-label=\"Merci\">Merci<span>.<\/span><\/a><div class=\"header-right\"><nav aria-label=\"Main navigation\"><a href=\"../index.html#work\">Work<\/a><a href=\"../index.html#about\">About<\/a><a href=\"../index.html#contact\">Contact<\/a><\/nav><div class=\"language-switch\" role=\"group\" aria-label=\"Language\"><a href=\"collision.html\" data-set-language=\"en\" lang=\"en\" hreflang=\"en\" aria-label=\"English\" aria-current=\"true\">EN<\/a><a href=\"../zh/projects/collision.html\" data-set-language=\"zh\" lang=\"zh-CN\" hreflang=\"zh-CN\" aria-label=\"\u7b80\u4f53\u4e2d\u6587\">\u4e2d\u6587<\/a><\/div><\/div><\/div><\/header><main id=\"main\" class=\"gold\"><a class=\"back\" href=\"../index.html#work\">All selected work<\/a><section class=\"case-head\"><div class=\"eyebrow\">03 / Physics simulation<\/div><h1>Adding algorithm choices to a collision engine.<\/h1><p class=\"lead\">I extended an existing physics-simulation engine with collision-query capabilities, adapting established algorithms to its geometry types, interfaces and data flow.<\/p><div class=\"case-meta\"><div><span class=\"label\">MY ROLE<\/span><p>Broadphase, midphase and narrowphase algorithm integration.<\/p><\/div><div><span class=\"label\">CONTEXT<\/span><p>An existing physics-simulation engine.<\/p><\/div><\/div><\/section><div class=\"demo\" data-demo=\"collision\"><div class=\"demo-head\"><span>Explore the concept \u00b7 Physics simulation<\/span><span>Synthetic illustration<\/span><\/div><div class=\"phase-grid\"><figure class=\"phase\"><canvas data-scene=\"collision\" data-panel=\"0\" role=\"img\" aria-label=\"Overlapping bounds identify potential pairs.\"><\/canvas><figcaption><h3>Broadphase \u00b7 SAP<\/h3><p>Overlapping bounds identify potential pairs.<\/p><\/figcaption><\/figure><figure class=\"phase\"><canvas data-scene=\"collision\" data-panel=\"1\" role=\"img\" aria-label=\"Hierarchical bounds restrict the region to examine.\"><\/canvas><figcaption><h3>Midphase \u00b7 BVH<\/h3><p>Hierarchical bounds restrict the region to examine.<\/p><\/figcaption><\/figure><figure class=\"phase\"><canvas data-scene=\"collision\" data-panel=\"2\" role=\"img\" aria-label=\"A convex-geometry query addresses a finer question.\"><\/canvas><figcaption><h3>Narrowphase \u00b7 GJK<\/h3><p>A convex-geometry query addresses a finer question.<\/p><\/figcaption><\/figure><\/div><div class=\"demo-controls\"><button type=\"button\" data-play>Play<\/button><label class=\"timeline\"><input type=\"range\" min=\"0\" max=\"1000\" value=\"0\" data-time aria-label=\"Demonstration time\"><output data-time-label>0.0 s<\/output><\/label><\/div><p class=\"demo-caption\">Conceptual collision-query stages. Candidate bounds and illustrative convex shapes explain responsibilities rather than engine internals. All visuals are independently created conceptual illustrations using synthetic data. They do not show internal implementations, product recordings or measured research results.<\/p><\/div><section class=\"story\"><div class=\"story-index\">01 / The problem<\/div><div class=\"story-body\"><h2>An algorithm has to fit the engine around it.<\/h2><p>The engine offered a limited set of collision-query options. Extending it required connecting algorithm inputs and outputs to its own object representations and processing stages.<\/p><p>The additions complemented the original choices. They did not replace the complete collision system.<\/p><\/div><\/section><section class=\"story\"><div class=\"story-index\">02 / Method<\/div><div class=\"story-body\"><h2>Three stages, three different questions.<\/h2><ol class=\"method-flow\" aria-label=\"Conceptual method\"><li><span class=\"flow-index\">01<\/span><h3>SAP \u00b7 Broadphase<\/h3><p>Potential object pairs<\/p><\/li><li><span class=\"flow-index\">02<\/span><h3>BVH \u00b7 Midphase<\/h3><p>Relevant geometry regions<\/p><\/li><li><span class=\"flow-index\">03<\/span><h3>GJK \u00b7 Narrowphase<\/h3><p>Convex geometry query<\/p><\/li><\/ol><p>Sweep and Prune belongs to the broadphase: spatial bounds and their overlap help identify candidate object pairs. Candidate filtering is not yet an exact contact determination.<\/p><p>A BVH midphase organizes finer geometry into hierarchical bounds so queries can restrict the region requiring further examination. GJK belongs to convex narrowphase queries, complementing existing algorithms including SAT.<\/p><\/div><\/section><section class=\"story\"><div class=\"story-index\">03 / Engineering choices<\/div><div class=\"story-body\"><h2>Integration with preserved algorithm options.<\/h2><div class=\"decision-grid\"><div class=\"decision\"><h3>Adapt the boundary between stages<\/h3><p>The host engine and reference implementations handled basic geometry types and data flow differently. I adapted representations and query interfaces so the added algorithms could participate in the engine\u2019s processing.<\/p><\/div><div class=\"decision\"><h3>Add capabilities without discarding existing choices<\/h3><p>Existing algorithms remained available. The engineering result was a wider set of selectable capabilities, not a claim that one algorithm universally outperforms the others.<\/p><\/div><\/div><\/div><\/section><section class=\"story\"><div class=\"story-index\">04 / Result & boundaries<\/div><div class=\"story-body\"><h2>More capability, with distinct responsibilities.<\/h2><p>The engine gained SAP, a BVH midphase and GJK as additional options. These were integrations of established algorithms; my contribution was implementation and adaptation within the host engine.<\/p><p>Broadphase candidates remain conservative approximations, and convex queries have geometric scope limits. The diagrams explain these responsibilities rather than replaying an internal engine execution.<\/p><\/div><\/section><div class=\"case-nav\"><div><small>Previous case<\/small><a href=\"lidar.html\">LiDAR perception<\/a><\/div><div><small>Next case<\/small><a href=\"motion.html\">Vision-based climbing analysis<\/a><\/div><\/div><\/main><footer><div class=\"wrap\"><span>Merci \u00b7 Perception & simulation<\/span><div class=\"footer-links\"><a href=\"https://github.com/hyandnn\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub<\/a><a href=\"mailto:haoling.yang@rwth-aachen.de\">Email<\/a><\/div><\/div><\/footer><script>document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(!h||/^(https?:|mailto:|data:)/.test(h))return;e.preventDefault();parent.postMessage({portfolioNavigation:h},'*');});<\/script><script>/* Independent conceptual scenes. No product data or production implementation. */\n(() => {\n  'use strict';\n  const TAU = Math.PI * 2;\n  const colors = { grid:'#1a2936', muted:'#879cac', point:'#7892a6', cyan:'#62e4d2', blue:'#85bbff', gold:'#f3bf77', text:'#dce7ef' };\n  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');\n  const scenes = [];\n  const language = document.documentElement?.dataset.language === 'zh' ? 'zh' : 'en';\n  const tr = (en,zh) => language==='zh'?zh:en;\n  const canvasFont = '-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"PingFang SC\",\"Microsoft YaHei\",\"Source Han Sans SC\",\"Noto Sans SC\",\"Noto Sans CJK SC\",sans-serif';\n  // Preferences are best-effort: local previews can block browser storage.\n  const storage = { get(){try{return localStorage.getItem('merci-language');}catch{return null;}}, set(v){try{localStorage.setItem('merci-language',v);}catch{}} };\n  function navigateLanguage(href){\n    if(window.parent!==window&&document.URL==='about:srcdoc')window.parent.postMessage({portfolioNavigation:href},'*');\n    else window.location.assign(href);\n  }\n  const languageLinks=[...document.querySelectorAll('[data-set-language]')];\n  for(const a of languageLinks)a.addEventListener('click',()=>{storage.set(a.dataset.setLanguage);if(window.location.hash)a.href+=window.location.hash;});\n  const preferred=storage.get();\n  // Only explicit saved choices redirect; a shared language URL works on first visit.\n  if(preferred&&preferred!==language){const link=languageLinks.find(a=>a.dataset.setLanguage===preferred);if(link)navigateLanguage(link.getAttribute('href'));}\n\n  const boxHit = (dx,dy,dz,box,limit) => {\n    let lo=0, hi=limit;\n    const axes = [[dx,box[0],box[2]],[dy,box[1],box[3]]];\n    if(dz !== null) axes.push([dz,-.36,box[4]-.36]);\n    for(const [v,mn,mx] of axes){\n      if(Math.abs(v)<1e-8){if(!(mn<=0&&0<=mx))return null;}\n      else{let a=mn/v,b=mx/v;if(a>b)[a,b]=[b,a];lo=Math.max(lo,a);hi=Math.min(hi,b);}\n    }\n    return hi>=lo&&lo>0&&lo<limit?lo:null;\n  };\n  function stereoData(t){\n    const shift=.09*Math.sin(t*TAU);\n    const boxes=[[-1.2+shift,2.7,-.35+shift,3.4,.7],[.85,4.3,1.75,4.9,1.1],[.1,1.4,.95,1.48,.04]];\n    const points=[];\n    for(let row=0;row<95;row++)for(let col=0;col<110;col++){\n      const distance=.36/(.06+row*.0063+.004*Math.sin(col*2.13+row*1.71));\n      const dx=-.60+1.2*col/109+.003*Math.sin(col*1.17+row*2.31),dz=-.36/distance;\n      let nearest=distance, object=-1;\n      boxes.forEach((b,i)=>{const hit=boxHit(dx,1,dz,b,nearest);if(hit!==null){nearest=hit;object=i;}});\n      const x=dx*nearest,y=nearest,z=.36+dz*nearest;\n      const gap=Math.sin(x*5.1+y*.7)*Math.cos(y*3.4-x*.3);\n      if(y<.48||y>6||(gap>.38&&object<0)||(gap>.75&&object>=0))continue;\n      if(y>3.9&&(row+col)%3===0)continue;\n      if(object===2&&col%6!==0)continue;\n      points.push({x,y,z,object});\n    }\n    return {boxes,points};\n  }\n  function rayHit(angle,objects,limit=4){\n    const dx=Math.sin(angle),dy=Math.cos(angle);let nearest=limit,object=null;\n    for(const o of objects){\n      let hit=null;\n      if(o.type==='circle'){\n        const [x,y,r]=o.shape,b=dx*x+dy*y,disc=b*b-(x*x+y*y-r*r);\n        if(disc>=0&&b>0)hit=b-Math.sqrt(disc);\n      }else hit=boxHit(dx,dy,null,o.shape,nearest);\n      if(hit!==null&&hit>0&&hit<nearest){nearest=hit;object=o;}\n    }\n    return {distance:nearest,object,dx,dy};\n  }\n  function targetAt(t){return [1.65*Math.sin(t*TAU),1.65+.15*Math.cos(t*TAU)];}\n  function lidarData(t){\n    const target=targetAt(t);\n    const objects=[{type:'box',shape:[-.45,.8,.45,1.05],id:'occluder'},\n      {type:'box',shape:[-3.2,1,-3,2.2],id:'fence'},\n      {type:'box',shape:[1.5,-2.8,3,-2.55],id:'edge'},\n      {type:'box',shape:[-2.8,-1.5,-.9,-1.25],id:'overhang'},\n      {type:'circle',shape:[2.5,2.25,.5],id:'tree'},\n      {type:'circle',shape:[-.9,3,.42],id:'shrub'},\n      {type:'circle',shape:[2.8,-.5,.5],id:'shrub'},\n      {type:'circle',shape:[-2.55,-.05,.3],id:'shrub'},\n      {type:'circle',shape:[...target,.23],id:'target'}];\n    const rays=[];\n    for(let k=0;k<360;k++){\n      const ray=rayHit(k*TAU/360,objects);\n      // Tiny deterministic range perturbation, never free-space random scatter.\n      const d=ray.distance+(ray.object?.id==='target'?0:.008*Math.sin(k*2.3));\n      rays.push({...ray,x:ray.dx*d,y:ray.dy*d,k});\n    }\n    const visible=rays.some(r=>r.object?.id==='target');\n    return {objects,rays,target,visible};\n  }\n  function line(ctx,points,color,width=1,dash=[]){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.setLineDash([]);}\n  function dot(ctx,x,y,color,r=1.5){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}\n  function text(ctx,label,x,y,color=colors.muted,size=14){ctx.font=`${size}px ${canvasFont}`;ctx.fillStyle=color;ctx.fillText(label,x,y);}\n  function outline(ctx,map,b,color,width=1){line(ctx,[map(b[0],b[1]),map(b[2],b[1]),map(b[2],b[3]),map(b[0],b[3]),map(b[0],b[1])],color,width);}\n  function robot(ctx,map,color){const [x,y]=map(0,0);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y-9);ctx.lineTo(x-6,y+4);ctx.lineTo(x+6,y+4);ctx.closePath();ctx.fill();}\n  function plotFrame(ctx,w,h,kind,panel,panels){\n    const left=panel*w/panels,right=(panel+1)*w/panels,pw=w/panels;\n    const preview=h<290;\n    let scale,cx,cy;\n    if(kind==='stereo'){scale=Math.min((pw-38)/7.4,(h-70)/6.6);cx=left+pw/2;cy=h-22;}\n    else{scale=Math.min((pw-40)/8.4,(h-70)/8.4);cx=left+pw/2;cy=(h+32)/2;}\n    const map=(x,y)=>[cx+x*scale,cy-y*scale];\n    ctx.save();ctx.beginPath();ctx.rect(left+1,45,pw-2,h-46);ctx.clip();\n    for(let x=-4;x<=4;x++){line(ctx,[map(x,kind==='stereo'?0:-4),map(x,kind==='stereo'?6:4)],colors.grid);}\n    for(let y=kind==='stereo'?0:-4;y<=(kind==='stereo'?6:4);y++)line(ctx,[map(-4,y),map(4,y)],colors.grid);\n    ctx.restore();\n    if(panel)line(ctx,[[left,20],[left,h-15]],'#263a49');\n    if(!preview){text(ctx,panels===1?tr('Top view','\u4fef\u89c6\u56fe'):panel?tr('Representation','\u51e0\u4f55\u8868\u793a'):tr('Observations','\u89c2\u6d4b\u70b9'),left+22,29,colors.text,16);}\n    else text(ctx,kind==='stereo'?tr('FORWARD / STEREO','\u524d\u5411 / \u53cc\u76ee'):tr('RETURNS + TRACK','\u56de\u6ce2 + \u8f68\u8ff9'),left+20,27,colors.muted,13);\n    return {map,scale,left,pw,preview};\n  }\n  function drawStereo(scene){\n    const {ctx,w,h,t,layers,preview}=scene,panels=!preview&&w>=720?2:1;\n    const {boxes,points}=stereoData(t);\n    for(let panel=0;panel<panels;panel++){\n      const {map,scale,left,pw}=plotFrame(ctx,w,h,'stereo',panel,panels);\n      const frustum=[map(-.6*.48,.48),map(-3.6,6),map(3.6,6),map(.6*.48,.48)];\n      ctx.fillStyle='#13253255';ctx.beginPath();frustum.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();line(ctx,[...frustum,frustum[0]],'#365766');\n      const geometry=layers.geometry&&(panels===1||panel===1);\n      if(layers.points)for(const p of points){const [x,y]=map(p.x,p.y);dot(ctx,x,y,p.object<0?'#466677':geometry?p.object===2?colors.gold:colors.cyan:'#a7bdc7',p.object<0?(preview?.65:.85):(preview?1:1.3));}\n      if(geometry){\n        boxes.slice(0,2).forEach(b=>outline(ctx,map,b,colors.cyan,1.7));\n        const b=boxes[2];line(ctx,[map(b[0],b[1]),map(b[2],b[1])],colors.gold,3,[4,3]);\n        if(!preview){const [x,y]=map(b[2],b[1]);line(ctx,[[x+6,y],[x+18,y-16]],colors.gold);const label=tr('Inferred thin geometry','\u7ec6\u5c0f\u969c\u788d\u7269\u63a8\u65ad');text(ctx,label,Math.max(left+10,Math.min(x+20,left+pw-(language==='zh'?145:165))),y-21,colors.gold,14);}\n      }\n      robot(ctx,map,colors.cyan);\n      if(!preview){const [x,y]=map(-2.3,5.7);text(ctx,tr('Gaps & occlusion','\u7f3a\u5931\u4e0e\u906e\u6321'),x,y,colors.muted,13);}\n    }\n  }\n  function drawLidar(scene){\n    const {ctx,w,h,t,layers,preview}=scene,panels=!preview&&w>=720?2:1;\n    const data=lidarData(t);\n    for(let panel=0;panel<panels;panel++){\n      const {map,scale,left}=plotFrame(ctx,w,h,'lidar',panel,panels),[cx,cy]=map(0,0);\n      for(const r of [2,4]){ctx.beginPath();ctx.strokeStyle='#2b4359';ctx.arc(cx,cy,r*scale,0,TAU);ctx.stroke();}\n      if(layers.rays)for(const ray of data.rays){if(ray.k%10===0)line(ctx,[[cx,cy],map(ray.x,ray.y)],ray.object?'#243e56':'#172837');}\n      if(layers.points)for(const ray of data.rays){if(ray.object)dot(ctx,...map(ray.x,ray.y),ray.object.id==='target'?colors.blue:ray.object.id==='overhang'?colors.gold:'#90abc2',preview?1.2:1.6);}\n      // Ghost outlines describe scene geometry, not unobserved sensor returns.\n      for(const o of data.objects){if(o.type==='box')outline(ctx,map,o.shape,'#3e526188',1);}\n      const tracking=layers.tracks&&(panels===1||panel===1);\n      if(tracking){\n        const path=[];for(let k=45;k>=0;k--)path.push(map(...targetAt(t-k*.002)));\n        line(ctx,path,'#507797',2);\n        const [tx,ty]=map(...data.target);\n        ctx.strokeStyle=colors.blue;ctx.lineWidth=1.7;ctx.setLineDash(data.visible?[]:[4,4]);ctx.strokeRect(tx-14,ty-14,28,28);ctx.setLineDash([]);\n        if(!data.visible)line(ctx,path.slice(-12),colors.blue,2,[4,4]);\n        if(!preview)text(ctx,data.visible?tr('Track 07','\u76ee\u6807 07'):tr('Track 07 \u00b7 occluded','\u76ee\u6807 07 \u00b7 \u906e\u6321'),tx-30,ty-23,colors.blue,14);\n      }\n      robot(ctx,map,colors.text);\n      if(!preview){const [x,y]=map(-2.8,-1.5);text(ctx,tr('Height structure','\u9ad8\u5ea6\u7ed3\u6784'),Math.max(left+10,x-18),y+24,colors.gold,13);}\n    }\n  }\n  function drawHero(scene){\n    const {ctx,w,h}=scene;\n    const scale=Math.min(w/9.1,h/6),cx=w*.34,cy=h*.85;\n    const iso=(x,y,z=0)=>[cx+(x*.87+y*.39)*scale,cy-(y*.53-x*.23+z)*scale];\n    for(let x=-3;x<=3;x++)line(ctx,[iso(x,0),iso(x,6)],'#223747');\n    for( [x,y]=map(.45,1.4);text(ctx,tr('Thin obstacle','\u7ec6\u5c0f\u969c\u788d\u7269'),Math.max(20,x-35),y-16,colors.gold,14);\n  }\n  function collisionShapes(t){return [[.26+.04*Math.sin(t*TAU),.45,.25,.29],[.46,.48,.25,.29],[.78,.32,.19,.23],[.76,.76,.16,.16]];}\n  function drawCollision(scene){\n    const {ctx,w,h,t}=scene,panel=scene.panel||0;grid(ctx,w,h);\n    const map=(x,y)=>[22+x*(w-44),h-30-y*(h-82)];\n    if(panel===0){\n      text(ctx,tr('POTENTIAL PAIRS','\u6f5c\u5728\u5bf9\u8c61\u5bf9'),20,28,colors.gold,13);\n      const shapes=collisionShapes(t);\n      shapes.forEach((b,i)=>{const [x,y,bw,bh]=b,p=[map(x-bw/2,y-bh/2),map(x+bw/2,y-bh/2),map(x+bw/2,y+bh/2),map(x-bw/2,y+bh/2)];polygon(ctx,p,i<2?colors.gold:'#607d90',i<2?'#f3bf7712':'#40576910');\n        const inner=p.map(([px,py])=>[(px+map(x,y)[0])/2,(py+map(x,y)[1])/2]);polygon(ctx,inner,i<2?'#c1a57f':'#627a8a');\n      });\n      const a=shapes[0],b=shapes[1];line(ctx,[map(a[0],a[1]),map(b[0],b[1])],colors.gold,2,[4,4]);\n      const base=h-22;line(ctx,[[30,base],[w-28,base]],'#507082');\n      shapes.slice(0,3).forEach((s,i)=>{const x0=map(s[0]-s[2]/2,0)[0],x1=map(s[0]+s[2]/2,0)[0];line(ctx,[[x0,base-6-i*6],[x1,base-6-i*6]],i<2?colors.gold:'#607d90',3);});\n    }else if(panel===1){\n      text(ctx,tr('HIERARCHICAL BOUNDS','\u5c42\u6b21\u5305\u56f4\u7ed3\u6784'),20,28,colors.gold,13);\n      const root=[map(.1,.1),map(.9,.1),map(.9,.92),map(.1,.92)];line(ctx,[...root,root[0]],'#557083',1,[4,4]);\n      for(let i=0;i<2;i++){\n        const x0=.17+i*.37,x1=x0+.29;const b=[map(x0,.18),map(x1,.18),map(x1,.84),map(x0,.84)];polygon(ctx,b,i===0?colors.gold:'#577284',i===0?'#f3bf7709':undefined);\n        for(let j=0;j<3;j++){const y=.27+j*.22;const tri=[map(x0+.035,y),map(x1-.025,y+.12),map(x0+.08,y+.17)];polygon(ctx,tri,i===0&&j===1?colors.gold:'#597485');}\n      }\n      text(ctx,tr('Selected region','\u9009\u4e2d\u7684\u51e0\u4f55\u533a\u57df'),22,h-9,colors.muted,13);\n    }else{\n      text(ctx,tr('CONVEX  of data.visible)dot(ctx,...localMap(...data.local([p.x,p.y])),'#9689ad',2.4);\n      for(const p of data.matches){const a=localMap(...data.local([p.x,p.y])),b=map(p.x,p.y);line(ctx,[a,b],'#b49a655f',1,[3,4]);dot(ctx,...a,colors.gold,3.5);dot(ctx,...b,colors.gold,3.5);}\n      const ax=wx+ww+12;line(ctx,[[ax,wy+wh*.75],[ax,wy+wh*.40]],accent,1.3);line(ctx,[[ax-3,wy+wh*.43],[ax,wy+wh*.40],[ax+3,wy+wh*.43]],accent,1.3);\n    }else{\n      text(ctx,tr('Aligned trajectory','\u5bf9\u9f50\u540e\u7684\u8f68\u8ff9'),18,25,accent,14);\n      const top=44,bottom=h*.53,ww=Math.min(w*.32,105),wx=(w-ww)/2;\n      const map=(x,y)=>[wx+x*ww,bottom-y*(bottom-top)];\n      polygon(ctx,[[wx,top],[wx+ww,top],[wx+ww,bottom],[wx,bottom]],'#514b64');\n      for(const p of data.holds)dot(ctx,...map(p.x,p.y),'#514b64',1.7);\n      const trail=[];for(let i=0;i<=80;i++)trail.push(map(...climberAt(t*i/80)));line(ctx,trail,accent,2);dot(ctx,...map(...data.climber),colors.text,3.5);\n      const gx=45,gy=h*.69,gw=w-65,gh=h*.20;\n      text(ctx,tr('Speed (normalized/s)','\u901f\u5ea6\uff08\u5f52\u4e00\u5316\u5750\u6807/\u79d2\uff09'),18,gy-13,accent,13);\n      line(ctx,[[gx,gy],[gx,gy+gh],[gx+gw,gy+gh]],'#6b7385');\n      text(ctx,'0.1',13,gy+4,colors.muted,12);text(ctx,'0',26,gy+gh+3,colors.muted,12);\n      const samples=[];for(let i=0;i<=100;i++)samples.push([gx+gw*i/100,gy+gh-speedAt(i/100)/.1*gh]);line(ctx,samples,'#7d699f',1.4);\n      const active=samples.slice(0,Math.floor(t*100)+1);if(active.length>1)line(ctx,active,accent,2);\n      dot(ctx,gx+gw*t,gy+gh-speedAt(t)/.1*gh,colors.text,3);\n      text(ctx,'0',gx-2,gy+gh+16,colors.muted,12);text(ctx,'12',gx+gw-12,gy+gh+16,colors.muted,12);\n      text(ctx,tr('Synthetic time (s)','\u793a\u610f\u65f6\u95f4\uff08\u79d2\uff09'),Math.max(gx+22,(w-140)/2),h-5,colors.muted,12);\n    }\n  }\n  function drawMotionCover(scene){\n    const {ctx,w,h}=scene,data=motionData(.42),accent='#c4aaff';grid(ctx,w,h);\n    text(ctx,tr('FIXED WALL / MOVING WIND n  for(const demo of document.querySelectorAll('[data-demo]')){\n    const group={demo,t:0,playing:false,scenes:[],layers:{points:true,geometry:true,rays:true,tracks:true},button:demo.querySelector('[data-play]'),range:demo.querySelector('[data-time]'),output:demo.querySelector('[data-time-label]')};\n    groups.push(group);setPlaying(group,false);\n    group.button.addEventListener('click',()=>setPlaying(group,!group.playing));\n    group.range.addEventListener('input',()=>{setPlaying(group,false);group.t=Number(group.range.value)/1000;renderGroup(group);});\n    for(const input of demo.querySelectorAll('[data-layer]'))input.addEventListener('change',()=>{group.layers[input.dataset.layer]=input.checked;renderGroup(group);});\n  }\n  for(const canvas of document.querySelectorAll('canvas[data-scene]')){\n    const group=groups.find(g=>g.demo===canvas.closest('[data-demo]'));\n    const scene={canvas,ctx:canvas.getContext('2d'),kind:canvas.dataset.scene,panel:Number(canvas.dataset.panel||0),preview:canvas.dataset.preview==='true',t:.25,layers:group?.layers||{points:true,geometry:true,rays:true,tracks:true},visible:true,group};\n    if(group)group.scenes.push(scene);scenes.push(scene);render(scene);\n  }\n  const resize=new ResizeObserver(entries=>{for(const entry of entries){const scene=scenes.find(s=>s.canvas===entry.target);if(scene)render(scene);}});\n  const observer=new IntersectionObserver(entries=>{for(const entry of entries){const scene=scenes.find(s=>s.canvas===entry.target);if(scene)scene.visible=entry.isIntersecting;}});\n  scenes.forEach(s=>{resize.observe(s.canvas);observer.observe(s.canvas);});groups.forEach(renderGroup);\n  let previous=0;\n  function animate(now){\n    if(now-previous>=32){const dt=previous?Math.min((now-previous)/1000,.1):0;previous=now;\n      if(!document.hidden)for(const group of groups)if(group.playing&&group.scenes.some(s=>s.visible)){group.t+=dt/12;if(group.t>=1){group.t=1;setPlaying(group,false);}renderGroup(group);}\n    }\n    requestAnimationFrame(animate);\n  }\n  // One upward scan finishes at the top; no artificial downward reset.\n  for(const group of groups)group.button.addEventListener('click',()=>{if(group.playing&&group.t>=1){group.t=0;renderGroup(group);}});\n  if(groups.length)requestAnimationFrame(animate);\n  reduced.addEventListener('change',e=>{if(e.matches)groups.forEach(g=>setPlaying(g,false));});\n})();\n<\/script><\/body><\/html>", "projects/lidar.html": "<!doctype html><html lang=\"en\" data-route=\"projects/lidar.html\" data-language=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"dark\"><title>LiDAR perception \u2014 Merci<\/title><meta name=\"description\" content=\"Introducing tracking into an established outdoor perception system.\"><link rel=\"alternate\" hreflang=\"zh-CN\" href=\"../zh/projects/lidar.html\"><link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iIzA5MGQxMiIvPjxwYXRoIGQ9Ik03IDI0VjlsOSA5IDktOXYxNSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNjJlNGQyIiBzdHJva2Utd2lkdGg9IjMiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4K\"><style>@charset \"UTF-8\";\n:root{color-scheme:dark;--bg:#090d12;--panel:#0e151e;--line:#24313e;--text:#edf3f6;--muted:#a2b1bf;--accent:#62e4d2;--blue:#85bbff;--gold:#f3bf77;--purple:#c4aaff;--max:1220px;--sans:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"PingFang SC\",\"Microsoft YaHei\",\"Source Han Sans SC\",\"Noto Sans SC\",\"Noto Sans CJK SC\",sans-serif;font-family:var(--sans);font-size:16px}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:110px}body{margin:0;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button,input{font:inherit}button,a,input{touch-action:manipulation}a:focus-v -height:32px;padding:3px 12px}.hero h1{font-size:clamp(2.3rem,9vw,3rem)}html:lang(zh-CN) .hero h1{font-size:clamp(2.2rem,9vw,2.9rem)}.hero-actions .primary-link{padding-inline:16px}.info-strip span{border:0!important;padding:0!important}.info-strip{justify-content:space-between;gap:8px;font-size:.8rem}.case-head h1{font-size:2.5rem}html:lang(zh-CN) .case-head h1{font-size:2.2rem}}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.project-card{transition:none}.project-card:hover{transform:none}}\n<\/style><\/head><body><a class=\"skip\" href=\"#main\">Skip to content<\/a><header><div class=\"wrap\"><a class=\"brand\" href=\"../index.html\" aria-label=\"Merci\">Merci<span>.<\/span><\/a><div class=\"header-right\"><nav aria-label=\"Main navigation\"><a href=\"../index.html#work\">Work<\/a><a href=\"../index.html#about\">About<\/a><a href=\"../index.html#contact\">Contact<\/a><\/nav><div class=\"language-switch\" role=\"group\" aria-label=\"Language\"><a href=\"lidar.html\" data-set-language=\"en\" lang=\"en\" hreflang=\"en\" aria-label=\"English\" aria-current=\"true\">EN<\/a><a href=\"../zh/projects/lidar.html\" data-set-language=\"zh\" lang=\"zh-CN\" hreflang=\"zh-CN\" aria-label=\"\u7b80\u4f53\u4e2d\u6587\">\u4e2d\u6587<\/a><\/div><\/div><\/div><\/header><main id=\"main\" class=\"blue\"><a class=\"back\" href=\"../index.html#work\">All selected work<\/a><section class=\"case-head\"><div class=\"eyebrow\">02 / LiDAR perception<\/div><h1>Keeping moving targets consistent across observations.<\/h1><p class=\"lead\">Outdoor targets move between observations. I led the introduction of tracking into an existing framework, alongside implementation, maintenance and deployment fixes.<\/p><div class=\"case-meta\"><div><span class=\"label\">MY ROLE<\/span><p>Tracking integration, implementation, maintenance and height-related deployment fixes.<\/p><\/div><div><span class=\"label\">CONTEXT<\/span><p>LiDAR-led multi-sensor perception for an outdoor robot.<\/p><\/div><\/div><\/section><div class=\"demo\" data-demo=\"lidar\"><div class=\"demo-head\"><span>Explore the concept \u00b7 LiDAR perception<\/span><span>Synthetic illustration<\/span><\/div><canvas data-scene=\"lidar\" role=\"img\" aria-label=\"Angular samples stop at the first surface. The dotted track segment distinguishes illustrative continuity during occlusion from current returns.\"><\/canvas><div class=\"demo-controls\"><button type=\"button\" data-play>Play<\/button><label class=\"timeline\"><input type=\"range\" min=\"0\" max=\"1000\" value=\"0\" data-time aria-label=\"Demonstration time\"><output data-time-label>0.0 s<\/output><\/label><div class=\"layers\" aria-label=\"Visualization layers\"><label><input type=\"checkbox\" data-layer=\"points\" checked>Returns<\/label><label><input type=\"checkbox\" data-layer=\"rays\" checked>Sampled rays<\/label><label><input type=\"checkbox\" data-layer=\"tracks\" checked>Track<\/label><\/div><\/div><p class=\"demo-caption\">Angular samples stop at the first surface. The dotted track segment distinguishes illustrative continuity during occlusion from current returns. All visuals are independently created conceptual illustrations using synthetic data. They do not show internal implementations, product recordings or measured research results.<\/p><\/div><section class=\"story\"><div class=\"story-index\">01 / The problem<\/div><div class=\"story-body\"><h2>A static representation meets a changing scene.<\/h2><p>People and pets move through outdoor environments. Processing each observation in isolation loses the continuity needed to describe a moving target; a static scene representation alone can be insufficient.<\/p><p>The overall architecture had been selected before I joined. I implemented and maintained the system, and led the addition of tracking to extend its handling of dynamic targets.<\/p><\/div><\/section><section class=\"story\"><div class=\"story-index\">02 / Method<\/div><div class=\"story-body\"><h2>From an observation to a state over time.<\/h2><ol class=\"method-flow\" aria-label=\"Conceptual method\"><li><span class=\"flow-index\">01<\/span><h3>Current observations<\/h3><p>Discrete returns & target evidence<\/p><\/li><li><span class=\"flow-index\">02<\/span><h3>Temporal association<\/h3><p>Continuity with motion context<\/p><\/li><li><span class=\"flow-index\">03<\/span><h3>Target state<\/h3><p>Position & trajectory over time<\/p><\/li><\/ol><p>A single observation describes what the sensor sees now. Tracking adds the question of which observations belong to the same target over time, supporting a continuous target state.<\/p><p>Robot motion changes the viewpoint and observation coordinates. Occlusion can remove returns temporarily without proving that a target has disappeared. These are reasons to interpret current observations together with motion context and temporal information.<\/p><\/div><\/section><section class=\"story\"><div class=\"story-index\">03 / Engineering choices<\/div><div class=\"story-body\"><h2>Preserve height and temporal context.<\/h2><div class=\"decision-grid\"><div class=\"decision\"><h3>An absent return is not a complete conclusion<\/h3><p>The synthetic track shows a short occlusion and an illustrative continuation. It distinguishes current measurement from temporal inference; it does not prescribe the deployed tracker\u2019s prediction policy.<\/p><\/div><div class=\"decision\"><h3>A flat grid can hide relevant structure<\/h3><p>I resolved deployment issues involving height information and overhanging obstacles. Outdoor scenes required care beyond a representation influenced by indoor two-dimensional grids.<\/p><\/div><\/div><\/div><\/section><section class=\"story\"><div class=\"story-index\">04 / Result & boundaries<\/div><div class=\"story-body\"><h2>A targeted extension to an operating system.<\/h2><p>I introduced tracking to address dynamic targets within the established framework. The contribution was integration and deployed-system engineering, rather than ownership of the original architecture.<\/p><p>LiDAR was the leading observation source in a multi-sensor system. Supporting sensors help interpret robot motion, but neither sensor context nor tracking removes all association ambiguity during occlusion.<\/p><\/div><\/section><div class=\"case-nav\"><div><small>Previous case<\/small><a href=\"stereo.html\">Stereo perception<\/a><\/div><div><small>Next case<\/small><a href=\"collision.html\">Physics simulation<\/a><\/div><\/div><\/main><footer><div class=\"wrap\"><span>Merci \u00b7 Perception & simulation<\/span><div class=\"footer-links\"><a href=\"https://github.com/hyandnn\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub<\/a><a href=\"mailto:haoling.yang@rwth-aachen.de\">Email<\/a><\/div><\/div><\/footer><script>document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(!h||/^(https?:|mailto:|data:)/.test(h))return;e.preventDefault();parent.postMessage({portfolioNavigation:h},'*');});<\/script><script>/* Independent conceptual scenes. No product data or production implementation. */\n(() => {\n  'use strict';\n  const TAU = Math.PI * 2;\n  const colors = { grid:'#1a2936', muted:'#879cac', point:'#7892a6', cyan:'#62e4d2', blue:'#85bbff', gold:'#f3bf77', text:'#dce7ef' };\n  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');\n  const scenes = [];\n  const language = document.documentElement?.dataset.language === 'zh' ? 'zh' : 'en';\n  const tr = (en,zh) => language==='zh'?zh:en;\n  const canvasFont = '-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"PingFang SC\",\"Microsoft YaHei\",\"Source Han Sans SC\",\"Noto Sans SC\",\"Noto Sans CJK SC\",sans-serif';\n  // Preferences are best-effort: local previews can block browser storage.\n  const storage = { get(){try{return localStorage.getItem('merci-language');}catch{return null;}}, set(v){try{localStorage.setItem('merci-language',v);}catch{}} };\n  function navigateLanguage(href){\n    if(window.parent!==window&&document.URL==='about:srcdoc')window.parent.postMessage({portfolioNavigation:href},'*');\n    else window.location.assign(href);\n  }\n  const languageLinks=[...document.querySelectorAll('[data-set-language]')];\n  for(const a of languageLinks)a.addEventListener('click',()=>{storage.set(a.dataset.setLanguage);if(window.location.hash)a.href+=window.location.hash;});\n  const preferred=storage.get();\n  // Only explicit saved choices redirect; a shared language URL works on first visit.\n  if(preferred&&preferred!==language){const link=languageLinks.find(a=>a.dataset.setLanguage===preferred);if(link)navigateLanguage(link.getAttribute('href'));}\n\n  const boxHit = (dx,dy,dz,box,limit) => {\n    let lo=0, hi=limit;\n    const axes = [[dx,box[0],box[2]],[dy,box[1],box[3]]];\n    if(dz !== null) axes.push([dz,-.36,box[4]-.36]);\n    for(const [v,mn,mx] of axes){\n      if(Math.abs(v)<1e-8){if(!(mn<=0&&0<=mx))return null;}\n      else{let a=mn/v,b=mx/v;if(a>b)[a,b]=[b,a];lo=Math.max(lo,a);hi=Math.min(hi,b);}\n    }\n    return hi>=lo&&lo>0&&lo<limit?lo:null;\n  };\n  function stereoData(t){\n    const shift=.09*Math.sin(t*TAU);\n    const boxes=[[-1.2+shift,2.7,-.35+shift,3.4,.7],[.85,4.3,1.75,4.9,1.1],[.1,1.4,.95,1.48,.04]];\n    const points=[];\n    for(let row=0;row<95;row++)for(let col=0;col<110;col++){\n      const distance=.36/(.06+row*.0063+.004*Math.sin(col*2.13+row*1.71));\n      const dx=-.60+1.2*col/109+.003*Math.sin(col*1.17+row*2.31),dz=-.36/distance;\n      let nearest=distance, object=-1;\n      boxes.forEach((b,i)=>{const hit=boxHit(dx,1,dz,b,nearest);if(hit!==null){nearest=hit;object=i;}});\n      const x=dx*nearest,y=nearest,z=.36+dz*nearest;\n      const gap=Math.sin(x*5.1+y*.7)*Math.cos(y*3.4-x*.3);\n      if(y<.48||y>6||(gap>.38&&object<0)||(gap>.75&&object>=0))continue;\n      if(y>3.9&&(row+col)%3===0)continue;\n      if(object===2&&col%6!==0)continue;\n      points.push({x,y,z,object});\n    }\n    return {boxes,points};\n  }\n  function rayHit(angle,objects,limit=4){\n    const dx=Math.sin(angle),dy=Math.cos(angle);let nearest=limit,object=null;\n    for(const o of objects){\n      let hit=null;\n      if(o.type==='circle'){\n        const [x,y,r]=o.shape,b=dx*x+dy*y,disc=b*b-(x*x+y*y-r*r);\n        if(disc>=0&&b>0)hit=b-Math.sqrt(disc);\n      }else hit=boxHit(dx,dy,null,o.shape,nearest);\n      if(hit!==null&&hit>0&&hit<nearest){nearest=hit;object=o;}\n    }\n    return {distance:nearest,object,dx,dy};\n  }\n  function targetAt(t){return [1.65*Math.sin(t*TAU),1.65+.15*Math.cos(t*TAU)];}\n  function lidarData(t){\n    const target=targetAt(t);\n    const objects=[{type:'box',shape:[-.45,.8,.45,1.05],id:'occluder'},\n      {type:'box',shape:[-3.2,1,-3,2.2],id:'fence'},\n      {type:'box',shape:[1.5,-2.8,3,-2.55],id:'edge'},\n      {type:'box',shape:[-2.8,-1.5,-.9,-1.25],id:'overhang'},\n      {type:'circle',shape:[2.5,2.25,.5],id:'tree'},\n      {type:'circle',shape:[-.9,3,.42],id:'shrub'},\n      {type:'circle',shape:[2.8,-.5,.5],id:'shrub'},\n      {type:'circle',shape:[-2.55,-.05,.3],id:'shrub'},\n      {type:'circle',shape:[...target,.23],id:'target'}];\n    const rays=[];\n    for(let k=0;k<360;k++){\n      const ray=rayHit(k*TAU/360,objects);\n      // Tiny deterministic range perturbation, never free-space random scatter.\n      const d=ray.distance+(ray.object?.id==='target'?0:.008*Math.sin(k*2.3));\n      rays.push({...ray,x:ray.dx*d,y:ray.dy*d,k});\n    }\n    const visible=rays.some(r=>r.object?.id==='target');\n    return {objects,rays,target,visible};\n  }\n  function line(ctx,points,color,width=1,dash=[]){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.setLineDash([]);}\n  function dot(ctx,x,y,color,r=1.5){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}\n  function text(ctx,label,x,y,color=colors.muted,size=1
